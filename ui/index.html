<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lumen</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="chrome41.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="topbar drag">
        <div class="wincontrols no-drag" id="wincontrols"></div>
        <div class="spacer"></div>
        <button class="ib no-drag" id="btn-sidebar" title="Hide sidebar (Shift+Cmd+S)"></button>
        <div class="navbtns no-drag">
          <button class="ib" id="btn-back" title="Back (Cmd+[)"></button>
          <button class="ib" id="btn-forward" title="Forward (Cmd+])"></button>
          <button class="ib" id="btn-reload" title="Reload (Cmd+R)"></button>
          <button class="ib" id="btn-translate" title="Translate page (Opt Cmd T)"></button>
        </div>
      </div>

      <div class="urlbar no-drag" id="urlbar">
        <button class="site" id="btn-site" title="Site settings and permissions"></button>
        <div class="urltext" id="urltext"><span class="host"></span><span class="path"></span></div>
        <span class="uhint" id="uhint" aria-hidden="true"></span>
        <div class="urlactions">
          <span class="privchip" id="privchip" title="Private window: nothing you do here is saved"></span>
          <span class="readpill" id="readpill" title="Estimated reading time"></span>
          <span class="shield" id="shield" title="Trackers and ads blocked on this page"></span>
          <button class="ib sm" id="btn-star" title="Bookmark (Cmd+D)"></button>
        </div>
      </div>

      <div class="extbar no-drag" id="extbar">
        <browser-action-list id="actions" partition="persist:lumen" alignment="bottom right"></browser-action-list>
      </div>

      <div class="pins no-drag" id="pins"></div>

      <button class="newtab no-drag" id="btn-newtab" title="New tab (Cmd+T)"><span class="plus"></span><span>New Tab</span><kbd id="kbd-newtab"></kbd></button>

      <div class="tablist no-drag" id="tablist">
        <div class="pill" id="pill"></div>
        <div class="tabs" id="tabs"></div>
      </div>

      <div class="bmbar no-drag" id="bmbar"></div>
      <div class="prompts no-drag" id="prompts"></div>

      <div class="nowplaying no-drag" id="nowplaying"></div>
      <div class="bottombar no-drag">
        <div class="hoverurl" id="hoverurl"></div>
        <div class="bottomrow">
          <button class="ib" id="btn-settings" title="Settings (Cmd+,)"></button>
          <button class="ib" id="btn-downloads" title="Downloads (Shift+Cmd+J)"><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5"/></svg></button>
          <button class="ib" id="btn-split" title="Split view (Shift+Cmd+\)"></button>
          <div class="spacer"></div>
          <button class="update" id="btn-update">Restart to update</button>
          <button class="ib" id="btn-menu" title="More from Lumen"></button>
        </div>
      </div>
    </aside>

    <div id="themebg"></div>
    <div id="nova-bg" aria-hidden="true"></div>
    <div id="peekzone"></div>
    <div id="resizer" class="no-drag"></div>
    <div id="content-shadow"></div>
    <div id="loadbar"><i></i></div>
    <div id="tabcard"><div class="tc-thumb"><img alt=""></div><div class="tc-body"><div class="tc-title"></div><div class="tc-host"><img class="tc-fav" alt=""><span></span></div><div class="tc-meta"></div></div></div>
    <aside id="aipanel" class="no-drag" aria-label="Lumen AI">
      <div class="ai-head chero"><i class="hb a"></i><i class="hb b"></i><span class="hart" id="ai-hart"></span><div class="ai-mark"></div><div class="grow"><div class="ai-title">Lumen AI</div><div class="ai-page" id="ai-page"></div></div><button class="ib sm" id="ai-clear" title="New chat"></button><button class="ib sm" id="ai-close" title="Close Lumen AI (Shift+Cmd+A)"></button></div>
      <div class="ai-actions"><button class="ai-chip" data-ai="summarize">Summarize page</button><button class="ai-chip" data-ai="keypoints">Key points</button><button class="ai-chip" data-ai="explain">Explain selection</button></div>
      <div class="ai-log" id="ai-log"></div>
      <div class="ai-nokey" id="ai-nokey"><div class="ai-mark big"></div><h4>Bring your own Claude key</h4><p>Lumen AI uses the Claude API with your own key, so your chats stay between you and Anthropic. Add a key once and you are set.</p><button class="btn primary" id="ai-addkey">Add API key</button></div>
      <form class="ai-input" id="ai-form"><textarea id="ai-q" rows="1" placeholder="Ask about this page"></textarea><button class="ai-send" id="ai-send" type="submit" title="Send"></button></form>
    </aside>
    <div id="findbar" class="no-drag">
      <span class="find-ic" id="find-ic"></span>
      <input id="find-input" placeholder="Find in page" spellcheck="false">
      <span id="find-count"></span>
      <button class="ib sm" id="find-prev" title="Previous match (Shift+Cmd+G)"></button>
      <button class="ib sm" id="find-next" title="Next match (Cmd+G)"></button>
      <button class="ib sm" id="find-close" title="Close (esc)"></button>
    </div>
    <div id="dragstrip" class="drag"></div>
  </div>

  <div id="trcard" aria-live="polite">
    <div class="tr-scrim"><div class="tr-scan"></div></div>
    <div class="tr-box">
      <div class="tr-aurora"><i></i><i></i><i></i></div>
      <div class="tr-border"></div>
      <div class="tr-stage">
        <div class="tr-halo"></div>
        <div class="tr-orb"><svg viewBox="0 0 100 100"><defs><radialGradient id="trorb" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#9fc0ff"/><stop offset=".45" stop-color="#5b8cff"/><stop offset="1" stop-color="#5a2fd0"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#trorb)"/><g class="tr-lat"><ellipse cx="50" cy="50" rx="46" ry="14"/><ellipse cx="50" cy="50" rx="46" ry="30"/><line x1="4" y1="50" x2="96" y2="50"/></g><g class="tr-lon"><ellipse class="l1" cx="50" cy="50" rx="12" ry="46"/><ellipse class="l2" cx="50" cy="50" rx="30" ry="46"/><ellipse class="l3" cx="50" cy="50" rx="42" ry="46"/></g><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/><ellipse cx="36" cy="28" rx="16" ry="9" fill="rgba(255,255,255,.28)"/></svg></div>
        <svg class="tr-prog" viewBox="0 0 150 150"><defs><linearGradient id="trpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset=".5" stop-color="#8a63f2"/><stop offset="1" stop-color="#e9609c"/></linearGradient></defs><circle class="bg" cx="75" cy="75" r="56"/><circle class="fg" id="tr-progc" cx="75" cy="75" r="56"/></svg>
        <div class="tr-ring" id="tr-ring"></div>
        <div class="tr-done"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <div class="tr-burst"><i></i><i></i><i></i></div>
      </div>
      <div class="tr-langs"><span class="tr-chip" id="tr-from"></span><span class="tr-arrow"><i></i><i></i><i></i></span><span class="tr-chip to" id="tr-to"></span></div>
      <div class="tr-title" id="tr-title">Translating</div>
      <div class="tr-sub" id="tr-sub"></div>
      <div class="tr-preview" id="tr-preview"><div class="tr-orig" id="tr-orig"></div><div class="tr-new" id="tr-new"></div></div>
      <div class="tr-barwrap"><div class="tr-bar"><i id="tr-fill"></i><b></b></div><span class="tr-pct" id="tr-pct">0%</span></div>
      <div class="tr-count" id="tr-count">Reading the page</div>
      <div class="tr-actions"><button class="tr-btn" id="tr-cancel">Cancel</button><button class="tr-btn" id="tr-orig-btn">Show original</button><button class="tr-btn" id="tr-always"></button></div>
      <div class="tr-sparks" id="tr-sparks"></div>
    </div>
  </div>
  <div id="trask" role="dialog" aria-label="Translate this page">
    <div class="ta-glow"></div>
    <div class="ta-icon"><span class="ta-g a">A</span><span class="ta-g b" id="ta-glyph"></span></div>
    <div class="ta-text"><div class="ta-title" id="ta-title"></div><div class="ta-sub" id="ta-sub"></div>
      <label class="ta-check"><input type="checkbox" id="ta-always"><span></span><em id="ta-always-l"></em></label></div>
    <div class="ta-btns"><button class="ta-btn primary" id="ta-yes">Translate</button><button class="ta-btn" id="ta-no">Not now</button><button class="ta-link" id="ta-never"></button></div>
    <div class="ta-timer"><i id="ta-timer"></i></div>
  </div>
  <div id="tabgrid">
    <div class="tg-scrim"></div>
    <div class="tg-head"><div class="tg-search"><span id="tg-ic"></span><input id="tg-q" placeholder="Search your tabs" spellcheck="false"></div><span class="tg-count" id="tg-count"></span><button class="tg-close" id="tg-close">Done</button></div>
    <div class="tg-list" id="tg-list"></div>
  </div>
  <div id="overlay">
    <div id="pageglass" aria-hidden="true"></div>
    <div class="scrim" id="scrim"></div>
    <div class="cmdbar" id="cmdbar">
      <div class="cmdinput">
        <span class="cmdicon" id="cmdicon"></span>
        <input id="cmd-input" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
        <kbd>esc</kbd>
      </div>
      <div class="cmdquick" id="cmd-quick"></div>
      <div class="cmdresults" id="cmd-results"></div>
      <div class="cmdfoot"><span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Tab</kbd> complete</span><span class="grow"></span><span class="cmdbrand">Lumen</span></div>
    </div>
    <div class="popover" id="popover"></div>
    <div class="peekbar" id="peekbar"></div>
  </div>

  <div id="toast"></div>

  <script src="spring.js"></script>
  <script src="jelly.js"></script>
  <script src="glass.js"></script>
  <script src="icons.js"></script>
  <script src="themes.js"></script>
  <script src="intro.js"></script>
  <script src="ui.js"></script>
</body>
</html>
