<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  :root{--solid:#f7f8fc;--accent:#5b8cff;--a2:oklch(from var(--accent) calc(l - .02) c calc(h + 40));--a3:oklch(from var(--accent) calc(l + .04) c calc(h + 95));--grad:linear-gradient(135deg,var(--accent),var(--a2) 55%,var(--a3));--bg:rgba(250,251,255,.94);--fg:#1c1d21;--fg2:rgba(28,29,33,.62);--fg3:rgba(28,29,33,.4);--line:rgba(20,24,40,.08);--hover:rgba(20,24,40,.06);--spring:cubic-bezier(.3,1.4,.5,1);--ease:cubic-bezier(.22,1,.36,1)}
  @media (prefers-color-scheme:dark){:root{--solid:#1e1f26;--bg:rgba(30,31,38,.94);--fg:#eeeef1;--fg2:rgba(238,238,241,.62);--fg3:rgba(238,238,241,.38);--line:rgba(255,255,255,.09);--hover:rgba(255,255,255,.07)}}
  html,body{margin:0;height:100%;background:transparent;font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;-webkit-user-select:none;overflow:hidden}
  .card{position:absolute;inset:12px;border-radius:24px;background:var(--bg);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 28px 70px -18px rgba(10,14,30,.55),0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden;animation:pop .7s var(--spring)}
  @keyframes pop{from{opacity:0;transform:translateY(-28px) scale(.9)}}
  .glow{position:absolute;left:-30%;right:-30%;top:-120px;height:220px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent);opacity:.55;pointer-events:none;animation:breathe 6s ease-in-out infinite alternate}
  @keyframes breathe{to{transform:translateY(14px) scale(1.08);opacity:.8}}
  .in{position:relative;height:100%;display:flex;flex-direction:column;padding:18px 20px 16px;gap:12px;box-sizing:border-box}
  .top{display:flex;align-items:center;gap:15px;-webkit-app-region:drag}
  .ic{position:relative;width:58px;height:58px;flex:none;display:grid;place-items:center;transition:transform .8s var(--spring)}
  .card:hover .ic{transform:scale(1.05) rotate(-4deg)}
  .ic img{width:44px;height:44px;border-radius:12px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
  .ic svg.ring{position:absolute;inset:0;transform:rotate(-90deg);opacity:0;transition:opacity .4s}
  .ic svg.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round}
  .ic svg.ring .bgc{stroke:var(--line)}
  .ic svg.ring .fg{stroke:url(#g);stroke-dasharray:170;stroke-dashoffset:170;transition:stroke-dashoffset .6s var(--ease)}
  .busy .ic svg.ring{opacity:1}
  .spin .ic svg.ring{animation:rot 1.3s linear infinite}.spin .ic svg.ring .fg{stroke-dashoffset:120}
  @keyframes rot{to{transform:rotate(270deg)}}
  .t{flex:1;min-width:0}
  .t b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t small{display:block;margin-top:2px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;gap:6px;align-items:center;flex:none}
  .chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--hover);color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip.v{color:#fff;background:var(--grad);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
  .chip.ok{color:#12b886;background:rgba(18,184,134,.13);display:none}.verified .chip.ok{display:inline-block}
  .x{-webkit-app-region:no-drag;width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--fg3);display:grid;place-items:center;cursor:default;transition:background .2s,color .2s}
  .x:hover{background:var(--hover);color:var(--fg)}
  .notes{margin:0;list-style:none;padding:12px 14px 12px 16px;border-radius:14px;background:var(--hover);display:none;flex-direction:column;gap:5px;font-size:12.5px;color:var(--fg)}
  .has-notes .notes{display:flex}
  .notes li{line-height:1.4;opacity:0;animation:li .6s var(--ease) forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notes li{position:relative;padding-left:16px}
  .notes li::before{content:'';position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--grad);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}
  @keyframes li{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .nh{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin:0 0 -4px 2px;display:none}.has-notes .nh{display:block}
  .bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;position:relative;display:none}.busy .bar{display:block}
  .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--grad);transition:width .5s var(--ease)}
  .spin .bar i{width:30%;animation:slide 1.1s ease-in-out infinite}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;min-height:15px}
  .row{display:flex;align-items:center;gap:8px;margin-top:auto}
  .grow{flex:1}
  .btn{-webkit-app-region:no-drag;border:0;padding:9px 18px;border-radius:12px;font:700 13px inherit;font-family:inherit;color:#fff;background:var(--grad);box-shadow:0 10px 26px -8px color-mix(in srgb,var(--accent) 80%,transparent);cursor:default;transition:transform .55s var(--spring),filter .2s,opacity .2s;white-space:nowrap}
  .btn:hover{transform:translateY(-1px) scale(1.04);filter:brightness(1.06)}.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.45;pointer-events:none}
  .lnk{-webkit-app-region:no-drag;border:0;background:none;font:600 12.5px inherit;font-family:inherit;color:var(--fg2);padding:8px 11px;border-radius:10px;cursor:default;transition:background .2s,color .2s,transform .5s var(--spring)}
  .lnk:hover{background:var(--hover);color:var(--fg);transform:translateY(-1px)}
  .error .btn{background:linear-gradient(135deg,#ffa94d,#ff6b6b);box-shadow:0 10px 26px -8px rgba(255,107,107,.7)}
  .error .glow{background:radial-gradient(closest-side,rgba(255,107,107,.3),transparent)}
  .done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--solid);font-size:16px;font-weight:700}
  .installing .done{display:flex;animation:fade .4s}@keyframes fade{from{opacity:0}}
  .done .orb{width:46px;height:46px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent);animation:pulse 1.4s ease-out infinite}
  .done .orb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pulse{to{box-shadow:0 0 0 22px transparent}}
  .done small{font-size:12px;font-weight:500;color:var(--fg2)}

  /* 1.20 glow-up: an aurora in your colors, a 3D entrance, a comet on the ring, a shining bar, a burst when it is ready */
  .card{animation:pop3 .9s cubic-bezier(.2,1.25,.3,1);transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,1,.3,1)}
  @keyframes pop3{from{opacity:0;transform:perspective(900px) translateY(-34px) rotateX(18deg) scale(.88)}to{opacity:1;transform:none}}
  .aur{position:absolute;inset:-40px;pointer-events:none;filter:blur(38px);opacity:.5}
  .aur i{position:absolute;width:260px;height:180px;border-radius:50%;mix-blend-mode:normal;animation:drift 14s ease-in-out infinite alternate}
  .aur i:nth-child(1){left:-40px;top:-90px;background:color-mix(in srgb,var(--accent) 55%,transparent)}
  .aur i:nth-child(2){right:-30px;top:-70px;background:color-mix(in srgb,var(--a2) 45%,transparent);animation-duration:17s;animation-delay:-5s}
  .aur i:nth-child(3){left:40%;bottom:-120px;background:color-mix(in srgb,var(--a3) 30%,transparent);animation-duration:21s;animation-delay:-9s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,26px) scale(1.15)}100%{transform:translate(-30px,40px) scale(.95)}}
  @media (prefers-color-scheme:dark){.aur{opacity:.42}}
  .glow{opacity:.35}
  .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 60%);transform:translateX(-120%);animation:sheen 1.4s .35s cubic-bezier(.3,.7,.2,1) both}
  @keyframes sheen{to{transform:translateX(120%)}}
  .in{z-index:1}
  .ic svg.ring .fg{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 80%,transparent))}
  .bar{height:7px;box-shadow:inset 0 0 0 1px var(--line)}
  .bar i{position:relative;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent)}
  .bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 1.6s ease-in-out infinite}
  @keyframes shine{to{transform:translateX(100%)}}
  .ready-now .ic img{animation:jelly 1s cubic-bezier(.3,1.6,.5,1)}
  @keyframes jelly{0%{transform:scale(1)}25%{transform:scale(1.18,.86)}45%{transform:scale(.9,1.12)}65%{transform:scale(1.06,.96)}100%{transform:scale(1)}}
  .btn{position:relative;overflow:hidden;isolation:isolate}
  .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-130%);z-index:-1}
  .ready-now .btn::after,.card:not(.busy):not(.error) .btn:hover::after{animation:btnshine 1.1s ease-out}
  .ready .btn::after{animation:btnshine 2.6s 1s ease-in-out infinite}
  @keyframes btnshine{to{transform:translateX(130%)}}
  .fx{position:absolute;inset:0;pointer-events:none;z-index:2}
  .fx b{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent)}
  .done{background:radial-gradient(120% 140% at 50% 0%,color-mix(in srgb,var(--accent) 16%,var(--solid)),var(--solid))}
  .done .orb{position:relative}
  .done .orb::before,.done .orb::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 60%,transparent);animation:ripple 1.8s ease-out infinite}
  .done .orb::after{animation-delay:.9s}
  @keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
  .chip.v{overflow:hidden;display:inline-flex}
  .chip .roll{display:inline-block;animation:roll .75s cubic-bezier(.3,1.6,.5,1) backwards}
  @keyframes roll{from{transform:translateY(130%);opacity:0;filter:blur(2px)}60%{opacity:1}}
  .notes li{animation-name:lispring;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  @keyframes lispring{from{opacity:0;transform:translateX(-12px) scale(.96)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.chip .roll{animation:none}.aur i,.bar i::after,.sheen,.ready .btn::after{animation:none}}
</style></head><body>
<div class="card" id="card">
  <div class="aur"><i></i><i></i><i></i></div><div class="glow"></div><div class="sheen"></div><div class="fx" id="fx"></div>
  <div class="in">
    <div class="top">
      <div class="ic"><img id="icon" src="../pages/icon-default.png" alt=""><svg class="ring" viewBox="0 0 58 58"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset=".55" style="stop-color:var(--a2)"/><stop offset="1" style="stop-color:var(--a3)"/></linearGradient></defs><circle class="bgc" cx="29" cy="29" r="27"/><circle class="fg" id="arc" cx="29" cy="29" r="27"/></svg></div>
      <div class="t"><b id="title">Update Lumen</b><small id="sub"></small></div>
      <div class="chips"><span class="chip ok" title="The download matched the fingerprint GitHub published for it">Verified</span><span class="chip" id="from"></span><span class="chip v" id="to"></span></div>
      <button class="x" id="close" title="Hide">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="nh">What is new</div>
    <ul class="notes" id="notes"></ul>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="meta"><span id="m1"></span><span id="m2"></span></div>
    <div class="row">
      <button class="lnk" id="skip">Skip this version</button>
      <span class="grow"></span>
      <button class="lnk" id="later">Later</button>
      <button class="btn" id="go">Update now</button>
    </div>
  </div>
  <div class="done"><div class="orb"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>Restarting Lumen<small>Your tabs come right back</small></div>
</div>
<script>
const $ = s => document.querySelector(s), api = window.lumenUpdate
const fmt = b => (b / 1048576).toFixed(1) + ' MB', secs = s => s >= 90 ? Math.round(s / 60) + ' min' : Math.max(1, Math.round(s)) + ' s'
const v = x => String(x || '').replace(/^v/, '')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
let U = {}, notesKey = ''
let lastStatus = ''
function burst() {
  const fx = $('#fx'), ic = $('.ic').getBoundingClientRect(), cr = $('#card').getBoundingClientRect()
  const x0 = ic.left - cr.left + ic.width / 2, y0 = ic.top - cr.top + ic.height / 2
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('b'), a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 90, s = .5 + Math.random() * .8
    d.style.left = x0 + 'px'; d.style.top = y0 + 'px'; fx.appendChild(d)
    d.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(${s})`, opacity: 1, offset: .55 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r * 1.25}px), calc(-50% + ${Math.sin(a) * r * 1.25 + 24}px)) scale(0)`, opacity: 0 }], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'forwards' }).onfinish = () => d.remove()
    setTimeout(() => d.remove(), 1600)   // also when the card is hidden and animations pause
  }
}
function paint(u) {
  U = u
  if (/^#[0-9a-f]{6}$/i.test(u.accent || '')) document.documentElement.style.setProperty('--accent', u.accent)
  if (u.status === 'ready' && lastStatus && lastStatus !== 'ready') { const c = $('#card'); setTimeout(() => { c.classList.add('ready-now'); burst(); setTimeout(() => c.classList.remove('ready-now'), 1200) }, 30) }
  lastStatus = u.status || ''
  const busy = ['checking', 'downloading', 'verifying', 'unpacking'].includes(u.status)
  const spin = u.status === 'checking' || u.status === 'verifying' || u.status === 'unpacking' || (u.status === 'downloading' && !u.size)
  const notes = (u.notes || []).slice(0, 6)
  $('#card').className = 'card ' + [busy && 'busy', spin && 'spin', u.status === 'error' && 'error', u.status === 'installing' && 'installing', u.status === 'ready' && 'ready', notes.length && 'has-notes', u.verified && 'verified'].filter(Boolean).join(' ')
  $('#from').textContent = u.latest && u.status !== 'uptodate' ? v(u.current) : ''
  $('#from').style.display = $('#from').textContent ? '' : 'none'
  // the new version number rolls in like a slot machine, once per version
  const toV = v(u.status === 'uptodate' ? u.current : u.latest || u.current)
  if ($('#to').dataset.v !== toV) { $('#to').dataset.v = toV; $('#to').innerHTML = toV.split('').map((c, i) => `<span class="roll" style="animation-delay:${.25 + i * .05}s">${esc(c)}</span>`).join('') }
  const T = {
    available: [`Lumen ${v(u.latest)} is here`, u.size ? `${fmt(u.size)}, downloads quietly in the background` : 'Downloads quietly in the background'],
    checking: ['Checking for updates', 'One moment'],
    downloading: [`Downloading Lumen ${v(u.latest)}`, u.speed ? `${fmt(u.speed)}/s${u.eta ? ', about ' + secs(u.eta) + ' left' : ''}` : 'Starting'],
    verifying: [`Checking the download`, 'Making sure it is exactly the file that was published'],
    unpacking: [`Getting Lumen ${v(u.latest)} ready`, 'Almost there'],
    ready: [`Lumen ${v(u.latest)} is ready`, 'Restart now, or it installs when you quit'],
    installing: ['Restarting', ''],
    error: ['The update hit a snag', u.error || 'Try again in a moment'],
    uptodate: [`Lumen ${v(u.current)} is up to date`, 'You have the newest version'],
  }[u.status] || ['Update Lumen', '']
  $('#title').textContent = T[0]; $('#sub').textContent = T[1]
  // progress ring around the icon and the bar
  const pct = u.status === 'downloading' ? (u.progress || 0) : ['verifying', 'unpacking', 'ready'].includes(u.status) ? 100 : 0
  $('#arc').style.strokeDashoffset = String(170 - 170 * pct / 100)
  $('#fill').style.width = pct + '%'
  $('#m1').textContent = u.status === 'downloading' && u.size ? `${fmt(u.bytes || 0)} of ${fmt(u.size)}  ·  ${u.progress || 0}%` : ''
  $('#m2').textContent = u.lastCheck ? `Checked ${new Date(u.lastCheck).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : ''
  // the notes animate in once per version
  const key = v(u.latest) + notes.join('|')
  if (key !== notesKey) { notesKey = key; $('#notes').innerHTML = notes.map((n, i) => `<li style="animation-delay:${.08 + i * .06}s" title="${esc(n)}">${esc(n)}</li>`).join('') }
  const b = $('#go'); b.disabled = false
  if (u.status === 'ready') b.textContent = 'Restart now'
  else if (busy && u.status !== 'checking') b.textContent = 'Cancel'
  else if (u.status === 'error') b.textContent = 'Try again'
  else if (u.status === 'checking') { b.textContent = 'Checking'; b.disabled = true }
  else if (u.status === 'uptodate') b.textContent = 'Done'
  else b.textContent = 'Update now'
  $('#later').textContent = u.status === 'ready' ? 'When I quit' : 'Later'
  $('#later').style.display = u.status === 'uptodate' ? 'none' : ''
  $('#skip').style.visibility = (u.status === 'available' || u.status === 'ready') ? 'visible' : 'hidden'
}
$('#go').onclick = () => {
  if (U.status === 'ready') api.action('install')
  else if (['downloading', 'verifying', 'unpacking'].includes(U.status)) api.action('cancel')
  else if (U.status === 'error') api.action('check')
  else if (U.status === 'uptodate') api.action('later')
  else api.action('download')
}
$('#later').onclick = () => api.action('later'); $('#skip').onclick = () => api.action('skip'); $('#close').onclick = () => api.action('later')
const card = $('#card')
addEventListener('mousemove', e => { const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; card.style.transform = `perspective(1000px) rotateX(${(-y * 2.4).toFixed(2)}deg) rotateY(${(x * 3.2).toFixed(2)}deg)` })
addEventListener('mouseleave', () => { card.style.transform = '' })
addEventListener('keydown', e => { if (e.key === 'Escape') api.action('later') })
;(async () => { const s = await api.action('state') || {}; if (s.appIcon) $('#icon').src = `../pages/icon-${s.appIcon}.png`; paint(s); api.on(paint) })()
</script></body></html>
