<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drop: shop every store, track every parcel</title>
  <meta name="description" content="Drop on the web: shop hundreds of stores in one place, save anything and watch its price, and track every parcel. No account, nothing to install.">
  <link rel="canonical" href="https://getlumen.info/drop/">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#14b884">
  <meta property="og:site_name" content="Drop">

  <meta property="og:description" content="Drop on the web: shop hundreds of stores in one place, save anything and watch its price, and track every parcel. No account, nothing to install.">
  <meta property="og:url" content="https://getlumen.info/drop/">
  <meta property="og:image" content="https://getlumen.info/drop/og.jpg">
  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","name":"Drop","url":"https://getlumen.info/drop/","description":"Shop hundreds of stores in one place, save anything and watch its price, and track every parcel."},{"@type":"SoftwareApplication","name":"Drop","applicationCategory":"ShoppingApplication","operatingSystem":"macOS, Windows, Web","softwareVersion":"1.6.0","url":"https://getlumen.info/drop/","image":"https://getlumen.info/drop/og.jpg","downloadUrl":"https://github.com/mabdulhadi0208-afk/mabdulhadi0208-afk-cart/releases/latest","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}]}</script>
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="web.css">
</head>
<body class="web">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- the Drop mark (1.4): a drop with a price-drop arrow cut out of it (the app icon's glyph) -->
      <symbol id="drop-mark" viewBox="200 210 624 624">
        <mask id="drop-mark-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><path d="M512 470V690M424 606L512 694L600 606" fill="none" stroke="#000" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/></mask>
        <path mask="url(#drop-mark-cut)" fill="currentColor" d="M512 214C566 304 738 440 738 604A226 226 0 1 1 286 604C286 440 458 304 512 214Z"/>
      </symbol>
    </defs>
  </svg>
  <div class="app">
    <!-- 1.6: a masthead instead of the side menu: the wordmark, the sections as words, a search that opens as a command panel -->
    <header class="top" id="top">
      <div class="brand" title="Drop">
        <span class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#drop-mark"/></svg></span>
        <span class="word">Drop</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-btn active" data-view="home"><i class="ni"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></i><span>Discover</span></button>
        <button class="nav-btn" data-view="stores"><i class="ni"><svg viewBox="0 0 24 24"><path d="M4 9.5L5.6 4.5h12.8L20 9.5"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M5.5 12v7.5h13V12"/></svg></i><span>Stores</span></button>
        <button class="nav-btn" data-view="shop" id="nav-shop"><i class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5s1.1-6.1 3.4-8.5z"/></svg></i><span>Browser</span><b class="badge" id="badge-shop"></b></button>
        <button class="nav-btn ic" data-view="saved" title="Saved"><i class="ni"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></i><span>Saved</span><b class="badge" id="badge-saved"></b></button>
        <button class="nav-btn ic" data-view="orders" title="Orders"><i class="ni"><svg viewBox="0 0 24 24"><path d="M3 6.5h11v9.5H3z"/><path d="M14 9.5h3.6L21 13v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></i><span>Orders</span><b class="badge live" id="badge-orders"></b></button>
        <button class="nav-btn ic" data-view="settings" title="Settings"><i class="ni"><svg viewBox="0 0 24 24"><path d="M5 7h9M18 7h1M5 12h2M11 12h8M5 17h7M16 17h3"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg></i><span>Settings</span></button>
      </nav>
      <button class="q-trig" id="q-trig" type="button" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><span>Search products, stores, parcels</span><kbd id="kbd"></kbd></button>
      <div class="top-r" id="top-r"></div>
    </header>
    <!-- the update ribbon: a slim announcement bar under the masthead -->
    <div class="upd" id="self-card" hidden>
      <span class="upd-ic"><svg class="upd-ring" viewBox="0 0 60 60"><rect class="bgc" x="3" y="3" width="54" height="54" rx="18"/><rect class="fg" id="self-arc" x="3" y="3" width="54" height="54" rx="18" pathLength="100"/></svg><span class="tile"><svg viewBox="0 0 64 64"><use href="#drop-mark"/></svg></span></span>
      <div class="upd-t"><span class="upd-eye" id="self-eye">Drop update</span><span class="upd-title" id="self-title">Update</span><span class="upd-sub" id="self-sub"></span></div>
      <div class="upd-acts"><button class="lnk" id="self-alt" hidden></button><button class="btn btn-solid small" id="self-btn">Update Drop</button></div>
      <div class="upd-bar"><i id="self-fill"></i></div>
    </div>
    <main class="main">
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- the command search: Cmd K or the search in the masthead -->
  <div class="cmd" id="cmd" hidden>
    <div class="cmd-card" role="dialog" aria-modal="true" aria-label="Search">
      <form class="search" id="search-f">
        <svg class="s-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" type="text" placeholder="Search products, stores, or paste a tracking number" autocomplete="off" spellcheck="false">
        <button type="button" class="clear" id="clear" title="Clear" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
        <kbd>esc</kbd>
      </form>
      <div class="cmd-body" id="cmd-body"></div>
      <div class="cmd-foot"><span id="side-foot">Ready</span><span class="sp"></span><span class="cmd-keys"><kbd>return</kbd> to search</span></div>
    </div>
  </div>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <aside class="sheet" id="sheet" hidden></aside>
  <div class="dlg-back" id="dlg" hidden></div>
  <div class="intro" id="intro" hidden></div>
  <div class="toasts" id="toasts"></div>
  <div class="restart" id="restart" hidden>
    <div class="rs-side"><div class="rs-orb"><svg viewBox="0 0 64 64"><use href="#drop-mark"/></svg></div><div class="rs-word">Drop</div><div class="rs-num" id="rs-num"></div></div>
    <div class="rs-tx"><div class="rs-eye">Updating</div><b>Restarting Drop</b><small id="rs-sub">Back in a few seconds, right where you left off</small><div class="rs-rail"><i></i><i></i><i></i></div><div class="rs-fine">Your tabs, carts, saved items and orders stay exactly where they are.</div></div>
  </div>

  <script src="lib.js"></script>
  <script src="shopify.js"></script>
  <script src="currency.js"></script>
  <script src="shim.js"></script>
  <script src="jelly.js"></script>
  <script src="app.js"></script>
</body>
</html>
