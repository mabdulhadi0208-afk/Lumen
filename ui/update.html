<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  /* Lumen Nova update card (1.23): liquid glass over an accent nebula, a bold header, the version change as a lit
     bridge between two numbers, the release notes on an inner glass panel, progress in the ring and along the card's
     edge, and a restart screen that warps into the new version. Everything follows your accent color.
     Every entrance starts visible (transform only), so a card that paints while hidden never shows blank text. */
  :root{--accent:#5b8cff;--a2:oklch(from var(--accent) calc(l - .02) c calc(h + 40));--a3:oklch(from var(--accent) calc(l + .04) c calc(h + 95));
    --nova:linear-gradient(135deg,var(--accent),var(--a2) 55%,var(--a3));
    --glass:rgba(245,246,251,.9);--solid:#f5f6fb;--fg:#15161c;--fg2:rgba(21,22,28,.64);--fg3:rgba(21,22,28,.42);--line:rgba(20,24,40,.09);--hover:rgba(20,24,40,.06);--panel:rgba(255,255,255,.55);
    --spec:rgba(255,255,255,.6);--ink:color-mix(in oklab,var(--accent) 70%,#000);
    --head:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,system-ui,sans-serif;
    --spring:cubic-bezier(.3,1.35,.5,1);--ease:cubic-bezier(.22,1,.36,1)}
  @media (prefers-color-scheme:dark){:root{--glass:rgba(10,12,21,.9);--solid:#0a0c15;--fg:#eff0f6;--fg2:rgba(239,240,246,.66);--fg3:rgba(239,240,246,.4);--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.07);--panel:rgba(255,255,255,.045);--spec:rgba(255,255,255,.14);--ink:color-mix(in oklab,var(--accent) 55%,#fff)}}
  html,body{margin:0;height:100%;background:transparent;font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;-webkit-user-select:none;overflow:hidden}

  /* the card: liquid glass with a specular top edge and a refractive rim from the accent to the third hue */
  .card{position:absolute;inset:12px;border-radius:24px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.8);overflow:hidden;isolation:isolate;
    box-shadow:inset 0 1px 0 var(--spec),0 0 0 .5px var(--line),0 2px 6px rgba(10,14,30,.12),0 8px 14px -6px color-mix(in srgb,var(--accent) 40%,transparent);
    animation:pop .9s cubic-bezier(.2,1.2,.3,1);transform-style:preserve-3d;transition:transform .6s var(--ease)}
  @keyframes pop{from{transform:perspective(900px) translateY(-6px) rotateX(10deg) scale(.95)}to{transform:none}}
  .card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:3;pointer-events:none;background:linear-gradient(135deg,var(--accent),transparent 38%,transparent 62%,var(--a3));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.85}
  /* the nebula in your colors, plus star dust in the dark */
  .aur{position:absolute;inset:-40px;pointer-events:none;filter:blur(36px);opacity:.5;z-index:-1}
  .aur i{position:absolute;width:280px;height:190px;border-radius:50%;animation:drift 16s ease-in-out infinite alternate}
  .aur i:nth-child(1){left:-50px;top:-100px;background:color-mix(in srgb,var(--accent) 60%,transparent)}
  .aur i:nth-child(2){right:-40px;top:-80px;background:color-mix(in srgb,var(--a2) 50%,transparent);animation-duration:19s;animation-delay:-5s}
  .aur i:nth-child(3){left:38%;bottom:-130px;background:color-mix(in srgb,var(--a3) 38%,transparent);animation-duration:23s;animation-delay:-9s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,26px) scale(1.15)}100%{transform:translate(-30px,40px) scale(.95)}}
  .dust{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;background-image:radial-gradient(1px 1px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 33% 68%,#fff,transparent),radial-gradient(1.4px 1.4px at 58% 18%,#fff,transparent),radial-gradient(1px 1px at 76% 54%,#fff,transparent),radial-gradient(1px 1px at 90% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 47% 88%,#fff,transparent),radial-gradient(1px 1px at 6% 80%,#fff,transparent),radial-gradient(1px 1px at 68% 84%,#fff,transparent)}
  @media (prefers-color-scheme:dark){.aur{opacity:.42}.dust{opacity:.35}}
  .sheen{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.2) 48%,transparent 60%);transform:translateX(-120%);animation:sheen 1.5s .35s cubic-bezier(.3,.7,.2,1) forwards}
  @keyframes sheen{to{transform:translateX(120%)}}
  /* progress also runs along the bottom edge of the glass */
  .edge{position:absolute;left:0;bottom:0;height:2px;width:0;z-index:3;background:var(--nova);box-shadow:0 0 10px var(--accent),0 0 2px var(--accent);transition:width .5s var(--ease),opacity .4s;opacity:0;border-radius:0 2px 2px 0}
  .busy .edge,.ready .edge{opacity:1}

  .in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:16px 18px 14px 18px;gap:12px;box-sizing:border-box}
  .top{display:flex;align-items:center;gap:14px;-webkit-app-region:drag}
  /* the app icon with its halo and the progress ring */
  .ic{position:relative;width:58px;height:58px;flex:none;display:grid;place-items:center;transition:transform .8s var(--spring)}
  .ic::before{content:'';position:absolute;inset:6px;border-radius:16px;background:var(--nova);filter:blur(14px);opacity:.55}
  .card:hover .ic{transform:scale(1.04) rotate(-3deg)}
  .ic img{position:relative;width:44px;height:44px;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
  .ic svg.ring{position:absolute;inset:0;transform:rotate(-90deg);opacity:0;transition:opacity .4s}
  .ic svg.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round}
  .ic svg.ring .bgc{stroke:var(--line)}
  .ic svg.ring .fg{stroke:url(#g);stroke-dasharray:170;stroke-dashoffset:170;transition:stroke-dashoffset .6s var(--ease);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 80%,transparent))}
  .busy .ic svg.ring,.ready .ic svg.ring{opacity:1}
  .spin .ic svg.ring{animation:rot 1.3s linear infinite}.spin .ic svg.ring .fg{stroke-dashoffset:120}
  @keyframes rot{to{transform:rotate(270deg)}}
  .t{flex:1;min-width:0}
  .t b{display:block;font:800 19px/1.2 var(--head);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:1px;
    background:linear-gradient(100deg,var(--fg) 45%,var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .t small{display:block;margin-top:2px;color:var(--fg2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* the version change: the old number, a lit bridge with light travelling across, the new number */
  .ver{display:flex;align-items:center;gap:0;flex:none;padding:3px;border-radius:999px;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
  .chip{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip.v{color:#fff;background:var(--nova);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent),0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent);overflow:hidden;display:inline-flex}
  .bridge{position:relative;width:26px;height:2px;margin:0 2px;border-radius:2px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--accent) 70%,transparent));overflow:visible}
  .bridge::after{content:'';position:absolute;right:-2px;top:-3px;width:6px;height:6px;border-top:2px solid color-mix(in srgb,var(--accent) 80%,transparent);border-right:2px solid color-mix(in srgb,var(--accent) 80%,transparent);transform:rotate(45deg);border-radius:1px}
  .bridge i{position:absolute;top:-2px;left:0;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px var(--accent);animation:travel 2.2s 1s ease-in-out infinite;opacity:0}
  @keyframes travel{0%{transform:translateX(-4px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(26px);opacity:0}}
  .solo .bridge,.solo #from{display:none}
  .chip .roll{display:inline-block;animation:roll .75s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes roll{from{transform:translateY(45%);opacity:.5}}
  .x{-webkit-app-region:no-drag;width:28px;height:28px;flex:none;border:0;border-radius:12px;background:none;color:var(--fg3);display:grid;place-items:center;cursor:default;transition:background .2s,color .2s,transform .5s var(--spring)}
  .x:hover{background:var(--hover);color:var(--fg)}.x:active{transform:scale(.92)}
  /* what is new, on an inner glass panel */
  .nh{display:none;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:0 0 -6px 4px}
  .nh::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .has-notes .nh{display:flex}
  .notes{margin:0;list-style:none;padding:11px 14px 11px 14px;border-radius:16px;background:var(--panel);box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--line);display:none;flex-direction:column;gap:5px;font-size:12.8px;color:var(--fg)}
  .has-notes .notes{display:flex;flex:1 0 auto;justify-content:center}
  .notes li{position:relative;padding-left:20px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:li .7s cubic-bezier(.3,1.4,.5,1) both}
  .notes li::before{content:'';position:absolute;left:2px;top:5px;width:8px;height:8px;border-radius:3px;transform:rotate(45deg);background:var(--nova);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}
  @keyframes li{from{transform:translateX(-10px);opacity:.55}to{transform:none;opacity:1}}
  /* the bottom row: skip, verified and progress on the left, the actions on the right */
  .row{display:flex;align-items:center;gap:8px;margin-top:auto;min-height:38px}
  .lft{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
  .chip.ok{display:none;align-items:center;gap:5px;color:#0f9f74;background:rgba(18,184,134,.13);box-shadow:inset 0 0 0 1px rgba(18,184,134,.22)}
  .chip.ok svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-color-scheme:dark){.chip.ok{color:#5fe0b5}}
  .verified .chip.ok{display:inline-flex}
  .prog{flex:1;min-width:0;display:none;flex-direction:column;gap:5px;max-width:300px}
  .busy .prog{display:flex}
  .bar{height:7px;border-radius:999px;background:var(--hover);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
  .bar i{position:relative;display:block;height:100%;width:0;border-radius:999px;background:var(--nova);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent);transition:width .5s var(--ease);overflow:hidden}
  .bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:shine 1.6s ease-in-out infinite}
  @keyframes shine{to{transform:translateX(100%)}}
  .spin .bar i{width:30%;animation:slide 1.1s ease-in-out infinite}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
  .meta{font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14px;min-height:14px}
  #m2{font-size:11.5px;color:var(--fg3);white-space:nowrap;padding-left:6px}
  .busy #m2,.available #m2,.ready #m2{display:none}
  .btn{-webkit-app-region:no-drag;position:relative;overflow:hidden;isolation:isolate;border:0;height:38px;padding:0 20px;border-radius:999px;font:800 13.5px/1 var(--head);letter-spacing:-.01em;color:#fff;background:var(--nova);cursor:default;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent),0 6px 16px -4px color-mix(in srgb,var(--accent) 75%,transparent);transition:transform .55s var(--spring),filter .2s,opacity .2s}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.07)}.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.5;pointer-events:none}
  .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-130%);z-index:-1;animation:btnshine 1.2s .9s ease-out forwards}
  .ready-now .btn::after{animation:btnshine 1.1s ease-out}
  .ready .btn::after{animation:btnshine 2.6s 1s ease-in-out infinite}
  @keyframes btnshine{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
  .lnk{-webkit-app-region:no-drag;border:0;background:none;font:650 12.5px/1 inherit;font-family:inherit;color:var(--fg2);height:32px;padding:0 12px;border-radius:999px;cursor:default;white-space:nowrap;transition:background .2s,color .2s,transform .5s var(--spring)}
  .lnk:hover{background:var(--hover);color:var(--fg);transform:translateY(-1px)}.lnk:active{transform:scale(.96)}
  .error .btn{background:linear-gradient(135deg,#ffa94d,#ff6b6b);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 4px rgba(255,107,107,.16),0 6px 16px -4px rgba(255,107,107,.7)}
  .error .aur i:nth-child(1){background:rgba(255,107,107,.45)}
  .error .ic::before{background:linear-gradient(135deg,#ffa94d,#ff6b6b)}
  .ready-now .ic img{animation:jelly 1s cubic-bezier(.3,1.5,.5,1)}
  @keyframes jelly{0%{transform:scale(1)}25%{transform:scale(1.14,.9)}45%{transform:scale(.93,1.08)}65%{transform:scale(1.04,.97)}100%{transform:scale(1)}}
  .fx{position:absolute;inset:0;pointer-events:none;z-index:4}
  .fx b{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--nova);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,transparent)}
  .fx b:nth-child(3n){width:5px;height:5px;border-radius:2px;background:#fff}

  /* the restart screen: the card warps into the new version */
  .done{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;gap:22px;padding:0 34px;overflow:hidden;
    background:radial-gradient(90% 120% at 30% 50%,color-mix(in srgb,var(--accent) 24%,var(--solid)),var(--solid) 75%)}
  .installing .done{display:flex;animation:dz .6s var(--ease)}
  @keyframes dz{from{transform:scale(1.04)}}
  .done .rays{position:absolute;left:50%;top:50%;width:760px;height:760px;margin:-380px 0 0 -380px;pointer-events:none;opacity:.4;
    background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 30%,transparent) 0 3deg,transparent 3deg 15deg);-webkit-mask:radial-gradient(closest-side,#000 8%,transparent 58%);mask:radial-gradient(closest-side,#000 8%,transparent 58%);animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done .streak{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 60%,transparent) 15%,rgba(255,255,255,.9) 16%,color-mix(in srgb,var(--a3) 60%,transparent) 30%,transparent 70%);opacity:.55;filter:blur(.5px)}
  .done .orb{position:relative;flex:none;width:96px;height:96px;display:grid;place-items:center}
  .done .orb::before,.done .orb::after{content:'';position:absolute;inset:8px;border-radius:28px;border:2px solid color-mix(in srgb,var(--accent) 65%,transparent);animation:ripple 2s ease-out infinite}
  .done .orb::after{animation-delay:1s;border-color:color-mix(in srgb,var(--a3) 60%,transparent)}
  @keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
  .done .orb .halo{position:absolute;inset:4px;border-radius:30px;background:var(--nova);filter:blur(18px);opacity:.75;animation:breathe 1.8s ease-in-out infinite alternate}
  @keyframes breathe{to{transform:scale(1.15);opacity:.95}}
  .done .orb img{position:relative;width:72px;height:72px;border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 28px color-mix(in srgb,var(--accent) 50%,transparent)}
  .done .orb .chk{position:absolute;right:4px;bottom:4px;width:26px;height:26px;border-radius:50%;background:var(--nova);display:grid;place-items:center;box-shadow:0 0 0 3px var(--solid),0 4px 12px color-mix(in srgb,var(--accent) 60%,transparent)}
  .done .orb .chk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .done .dt{position:relative;min-width:0;display:flex;flex-direction:column;gap:6px}
  .done .dt b{font:800 26px/1.1 var(--head);letter-spacing:-.035em;background:linear-gradient(100deg,var(--fg) 30%,var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
  .done .dt small{font-size:13px;color:var(--fg2)}
  .done .dt .ver{align-self:flex-start;margin-top:4px}
  .done .dots{display:flex;gap:5px;margin-top:6px}
  .done .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 1.2s ease-in-out infinite}
  .done .dots i:nth-child(2){animation-delay:.15s;background:var(--a2)}.done .dots i:nth-child(3){animation-delay:.3s;background:var(--a3)}
  @keyframes dot{50%{transform:translateY(-4px) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){.card,.chip .roll,.notes li,.installing .done{animation:none}.aur i,.bar i::after,.sheen,.btn::after,.bridge i,.done .rays,.done .orb::before,.done .orb::after,.done .orb .halo,.done .dots i{animation:none}}
</style></head><body>
<div class="card" id="card">
  <div class="aur"><i></i><i></i><i></i></div><div class="dust"></div><div class="sheen"></div><div class="fx" id="fx"></div><i class="edge" id="edge"></i>
  <div class="in">
    <div class="top">
      <div class="ic"><img id="icon" src="../pages/icon-default.png" alt=""><svg class="ring" viewBox="0 0 58 58"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset=".55" style="stop-color:var(--a2)"/><stop offset="1" style="stop-color:var(--a3)"/></linearGradient></defs><circle class="bgc" cx="29" cy="29" r="27"/><circle class="fg" id="arc" cx="29" cy="29" r="27"/></svg></div>
      <div class="t"><b id="title">Update Lumen</b><small id="sub"></small></div>
      <div class="ver" id="ver"><span class="chip" id="from"></span><span class="bridge"><i></i></span><span class="chip v" id="to"></span></div>
      <button class="x" id="close" title="Hide">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="nh" id="nh">What is new</div>
    <ul class="notes" id="notes"></ul>
    <div class="row">
      <div class="lft">
        <button class="lnk" id="skip">Skip this version</button>
        <span class="chip ok" title="The download matched the fingerprint GitHub published for it"><svg viewBox="0 0 12 12"><path d="m2.5 6.3 2.3 2.2 4.7-5"/></svg>Verified</span>
        <div class="prog"><div class="bar" id="bar"><i id="fill"></i></div><div class="meta" id="m1"></div></div>
        <span id="m2"></span>
      </div>
      <button class="lnk" id="later">Later</button>
      <button class="btn" id="go">Update now</button>
    </div>
  </div>
  <div class="done"><div class="streak"></div>
    <div class="orb"><div class="rays"></div><div class="halo"></div><img id="dicon" src="../pages/icon-default.png" alt=""><span class="chk"><svg viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7"/></svg></span></div>
    <div class="dt"><b>Restarting Lumen</b><small>Your tabs come right back</small><div class="ver"><span class="chip" id="dfrom"></span><span class="bridge"><i></i></span><span class="chip v" id="dto"></span></div><div class="dots"><i></i><i></i><i></i></div></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s), api = window.lumenUpdate
const fmt = b => (b / 1048576).toFixed(1) + ' MB', secs = s => s >= 90 ? Math.round(s / 60) + ' min' : Math.max(1, Math.round(s)) + ' s'
const v = x => String(x || '').replace(/^v/, '')
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
let U = {}, notesKey = '', lastStatus = ''
// the download finished while you watched: sparks fly out of the icon
function burst() {
  const fx = $('#fx'), ic = $('.ic').getBoundingClientRect(), cr = $('#card').getBoundingClientRect()
  const x0 = ic.left - cr.left + ic.width / 2, y0 = ic.top - cr.top + ic.height / 2
  for (let i = 0; i < 24; i++) {
    const d = document.createElement('b'), a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 100, s = .5 + Math.random() * .8
    d.style.left = x0 + 'px'; d.style.top = y0 + 'px'; fx.appendChild(d)
    d.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(${s})`, opacity: 1, offset: .55 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r * 1.25}px), calc(-50% + ${Math.sin(a) * r * 1.25 + 24}px)) scale(0)`, opacity: 0 }], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'forwards' }).onfinish = () => d.remove()
    setTimeout(() => d.remove(), 1600)   // also when the card is hidden and animations pause
  }
}
// a version number that rolls in digit by digit, once per version

    checking: ['Checking for updates', 'One moment'],
    downloading: [`Downloading Lumen ${v(u.latest)}`, u.speed ? `${fmt(u.speed)}/s${u.eta ? ', about ' + secs(u.eta) + ' left' : ''}` : 'Starting'],
    verifying: ['Checking the download', 'Making sure it is exactly the file that was published'],
    unpacking: [`Getting Lumen ${v(u.latest)} ready`, 'Almost there'],
