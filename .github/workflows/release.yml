name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # Intel runner: GitHub's Apple Silicon Mac runners are often out of capacity. Intel builds both architectures.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: Import signing certificate (stable identity so Keychain and permissions survive updates)
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > cert.p12
            security create-keychain -p temp build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p temp build.keychain
            security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain >/dev/null
            LEAF=$(security find-certificate -c "Lumen Dev" -Z build.keychain | awk '/SHA-1/{print $3}')
            echo "SIGN_ID=Lumen Dev" >> $GITHUB_ENV
            echo "LEAF=$LEAF" >> $GITHUB_ENV
            echo "certificate imported, leaf $LEAF"
          else
            echo "SIGN_ID=-" >> $GITHUB_ENV
            echo "no MAC_CERT_P12 secret, using ad-hoc signing"
          fi

      - name: Package, sign, zip and DMG (Apple Silicon and Intel)
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          npx electron-builder --mac dir --arm64 --x64 --publish never
          for ARCH in arm64 x64; do
            if [ "$ARCH" = "arm64" ]; then APP=dist/mac-arm64/Lumen.app; else APP=dist/mac/Lumen.app; fi
            test -d "$APP" || { echo "missing $APP"; ls dist; exit 1; }
            if [ "$SIGN_ID" = "-" ]; then
              codesign --force --deep --sign - "$APP"
            else
              # nested code first with its own identity; the pinned requirement goes on the main bundle only
              codesign --force --deep --sign "$SIGN_ID" "$APP"
              codesign --force --sign "$SIGN_ID" --requirements "=designated => identifier \"app.lumen.browser\" and certificate leaf = H\"$LEAF\"" "$APP"
            fi
            # ZIP is what the in-app updater installs: keeps the cert signature, so the identity never changes
            ( cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent Lumen.app "$GITHUB_WORKSPACE/dist/Lumen-mac-$ARCH.zip" )
            # DMG is for fresh downloads: re-signed ad-hoc, because Gatekeeper calls a self-signed app "damaged"
            STAGE=$(mktemp -d); cp -R "$APP" "$STAGE/"
            codesign --force --deep --sign - "$STAGE/Lumen.app"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname Lumen -srcfolder "$STAGE" -ov -format UDZO -imagekey zlib-level=6 -quiet "dist/Lumen-mac-$ARCH.dmg"
          done
          if [ "$SIGN_ID" != "-" ]; then echo "Lumen Dev $LEAF" > dist/Lumen-identity.txt; fi
          ls -la dist/*.dmg dist/*.zip

      - name: Release gate (refuse to publish broken files)
        run: |
          set -e
          # test the build that matches this runner's chip
          if [ "$(uname -m)" = "arm64" ]; then APP=dist/mac-arm64/Lumen.app; DMG=dist/Lumen-mac-arm64.dmg; else APP=dist/mac/Lumen.app; DMG=dist/Lumen-mac-x64.dmg; fi
          echo "testing $APP on $(uname -m)"
          codesign --verify --deep --strict dist/mac-arm64/Lumen.app && echo "arm64 zip app signature valid"
          codesign --verify --deep --strict "$APP" && echo "zip app signature valid"
          if [ "$SIGN_ID" != "-" ]; then codesign -d -r- "$APP" 2>&1 | grep -qi "certificate leaf = H\"$LEAF\"" && echo "zip app has the pinned identity" || { echo "zip app is not cert-signed"; exit 1; }; fi
          MNT=$(mktemp -d); hdiutil attach -nobrowse -quiet -mountpoint "$MNT" "$DMG"
          codesign -dv "$MNT/Lumen.app" 2>&1 | grep -q 'Signature=adhoc' && echo "dmg app is ad-hoc (right-click, Open works)" || { echo "dmg app is not ad-hoc"; hdiutil detach -quiet "$MNT"; exit 1; }
          codesign --verify --deep --strict "$MNT/Lumen.app" && echo "dmg app signature valid"
          test -L "$MNT/Applications" && echo "dmg has Applications shortcut"
          hdiutil detach -quiet "$MNT"
          # real update test: install, launch, make it update itself (swap + relaunch), make sure it stays up
          V=$(node -p "require('./package.json').version"); L=~/Library/Logs/Lumen
          rm -rf /Applications/Lumen.app "$L"; ditto "$APP" /Applications/Lumen.app
          mkdir -p "$HOME/Library/Application Support/Lumen"
          echo '{"introSeen":true,"autoUpdate":false}' > "$HOME/Library/Application Support/Lumen/settings.json"
          (LUMEN_SELFTEST=swap /Applications/Lumen.app/Contents/MacOS/Lumen >/dev/null 2>&1 &); sleep 4
          P1=$(pgrep -f "/Applications/Lumen.app/Contents/MacOS/Lumen" | head -1); [ -n "$P1" ] && echo "app launched (pid $P1)" || { echo "app did not launch"; cat $L/lumen.log || true; exit 1; }
          sleep 30
          grep -q "launched OK" $L/update.log && echo "update swap relaunched the app" || { echo "swap did not relaunch"; cat $L/update.log $L/lumen.log || true; exit 1; }
          P2=$(pgrep -f "/Applications/Lumen.app/Contents/MacOS/Lumen" | head -1); [ -n "$P2" ] && [ "$P2" != "$P1" ] && echo "new process after update (pid $P2)" || { echo "no new process after update"; cat $L/update.log $L/lumen.log; exit 1; }
          sleep 15
          kill -0 $P2 2>/dev/null && echo "still running 15s after the update" || { echo "app QUIT after updating"; cat $L/update.log $L/lumen.log; exit 1; }
          [ "$(grep -c "boot $V" $L/lumen.log)" -ge 2 ] && echo "booted twice, version $V" || { echo "expected two boots"; cat $L/lumen.log; exit 1; }
          grep -i "UNCAUGHT\|UNHANDLED" $L/lumen.log && { echo "errors in log"; exit 1; } || echo "no errors in log"
          echo "----- lumen.log"; cat $L/lumen.log; echo "----- update.log"; cat $L/update.log
          kill -TERM $P2; sleep 4
          for f in dist/Lumen-mac-arm64.dmg dist/Lumen-mac-arm64.zip dist/Lumen-mac-x64.dmg dist/Lumen-mac-x64.zip; do s=$(stat -f%z "$f"); [ "$s" -gt 60000000 ] && echo "$f $s bytes" || { echo "$f too small ($s)"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/Lumen-mac-*.dmg
            dist/Lumen-mac-*.zip
            dist/Lumen-identity.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --win --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Release gate (installer installs, app boots)
        shell: pwsh
        run: |
          $exe = Get-Item dist\Lumen-win-x64.exe
          if ($exe.Length -lt 50MB) { throw "installer too small: $($exe.Length)" }
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Lumen\Lumen.exe"
          for ($i = 0; $i -lt 60 -and !(Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (!(Test-Path $app)) { throw "silent install did not produce $app" }
          New-Item -ItemType Directory -Force "$env:APPDATA\Lumen" | Out-Null
          '{"introSeen":true,"autoUpdate":false}' | Set-Content "$env:APPDATA\Lumen\settings.json"
          Start-Process -FilePath $app; Start-Sleep -Seconds 12
          $log = "$env:APPDATA\Lumen\logs\lumen.log"
          if (!(Test-Path $log)) { throw "no log written, app did not boot" }
          $v = node -p "require('./package.json').version"
          if (!(Select-String -Path $log -Pattern "boot $v" -Quiet)) { Get-Content $log; throw "boot line missing" }
          if (Select-String -Path $log -Pattern "UNCAUGHT|UNHANDLED" -Quiet) { Get-Content $log; throw "errors during boot" }
          "app boots on Windows"
          Stop-Process -Name Lumen -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Lumen-win-x64.exe

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Lumen ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
          make_latest: true
          body: |
            Lumen ${{ steps.v.outputs.tag }}
            Mac: download Lumen-mac-arm64.dmg (Apple Silicon) or Lumen-mac-x64.dmg (Intel), drag to Applications, right-click and Open the first time.
            Windows: run Lumen-win-x64.exe (SmartScreen: More info, Run anyway).
            Already installed? Lumen updates itself.
