<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lumen toast</title>
<!-- Lumen's toast over the page when tabs are on top (src/nova.js): a glass capsule that springs down from under the
     toolbar, says what happened with an icon gem, and runs out on a hairline timer. No emoji. -->
<style>
:root {
  --accent: #5b8cff;
  --accent2: oklch(from var(--accent) calc(l - .02) c calc(h + 40));
  --accent3: oklch(from var(--accent) calc(l + .04) c calc(h + 95));
  --nova: linear-gradient(135deg, var(--accent), var(--accent2) 55%, var(--accent3));
  --fg: #141722; --tint: rgba(250, 251, 255, .78); --line: rgba(20, 24, 48, .09);
  --rim: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(255, 255, 255, .35), inset 1.5px 0 0 rgba(255, 79, 139, .14), inset -1.5px 0 0 rgba(63, 212, 255, .18);
  --shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 26%, transparent), 0 0 0 5px color-mix(in srgb, var(--accent) 10%, transparent), 0 2px 4px rgba(14, 18, 40, .08), 0 12px 28px -8px color-mix(in srgb, var(--accent) 50%, rgba(14, 18, 40, .25));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, var(--font);
}
.dark { --fg: #eef0fa; --tint: color-mix(in srgb, var(--accent) 12%, rgba(11, 13, 26, .86)); --line: rgba(255, 255, 255, .1);
  --rim: inset 0 1px 0 rgba(255, 255, 255, .26), inset 0 -1px 0 rgba(255, 255, 255, .06), inset 1.5px 0 0 rgba(255, 79, 139, .22), inset -1.5px 0 0 rgba(63, 212, 255, .24);
  --shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 0 5px color-mix(in srgb, var(--accent) 12%, transparent), 0 2px 4px rgba(0, 0, 0, .4), 0 12px 28px -8px color-mix(in srgb, var(--accent) 60%, rgba(0, 0, 0, .5)); }
.incognito { --accent: #a77dff; --accent2: #c45cff; --accent3: #ff4fb8; --tint: rgba(30, 14, 58, .88); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px/1.3 var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
#t {
  position: absolute; left: 50%; top: 8px; display: flex; align-items: center; gap: 11px; min-height: 44px; max-width: calc(100vw - 48px); padding: 7px 18px 7px 7px;
  border-radius: 999px; isolation: isolate; opacity: 0; translate: -50% 0; transform-origin: 50% 0; will-change: transform, opacity;
  box-shadow: var(--rim), var(--shadow);
}
#t.act { padding-right: 6px; }
#t > .glass { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: -1; }
.glass .under { position: absolute; inset: -20px; filter: blur(14px) saturate(1.9) brightness(1.04); opacity: 0; transition: opacity .2s; }
.glass .under.on { opacity: 1; }
.glass .under img { position: absolute; display: block; }
.glass .tint { position: absolute; inset: 0; background: var(--tint); }
.glass .lit { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .45), transparent 55%), radial-gradient(60% 140% at 0% 50%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%); }
.dark .glass .lit { background: linear-gradient(180deg, rgba(255, 255, 255, .08), transparent 55%), radial-gradient(60% 140% at 0% 50%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%); }
.orb { position: relative; width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
  background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .55), transparent 55%), var(--nova);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent), 0 4px 12px -2px color-mix(in srgb, var(--accent) 55%, transparent); }
.orb svg { width: 16px; height: 16px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); }
.bad .orb { background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .55), transparent 55%), linear-gradient(140deg, #ff7a6a, #e5484d); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 0 0 3px rgba(229, 72, 77, .18), 0 4px 12px -2px rgba(229, 72, 77, .55); }
.msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 750 13.5px var(--display); letter-spacing: -.012em; }
.btn { flex: none; position: relative; overflow: hidden; border: 0; border-radius: 999px; padding: 8px 16px; font: 800 13px var(--display); color: #fff; cursor: default;
  background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .45), transparent 55%), var(--nova); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 4px 12px -2px color-mix(in srgb, var(--accent) 55%, transparent);
  transition: transform .35s cubic-bezier(.3, 1.5, .5, 1), filter .2s; }
.btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn:active { transform: scale(.95); }
.btn[hidden] { display: none; }
.bad .btn { background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .45), transparent 55%), linear-gradient(140deg, #ff7a6a, #e5484d); }
.time { position: absolute; left: 26px; right: 26px; bottom: 1px; height: 2px; border-radius: 2px; overflow: hidden; }
.time i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent3)); box-shadow: 0 0 6px var(--accent); transform-origin: left; }
.bad .time i { background: linear-gradient(90deg, #ff7a6a, #e5484d); }

/* ------------------------------------------------------------- Lumen 4.1: a bigger capsule with a spectral rim */
#t { min-height: 50px; gap: 12px; padding: 8px 22px 8px 8px; }
#t.act { padding-right: 7px; }
#t::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 3;
  background: linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent2) 70%, #fff) 40%, rgba(255, 255, 255, .5) 55%, var(--accent3));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .85; }
.bad#t::before, #t.bad::before { background: linear-gradient(120deg, #ff7a6a, rgba(255, 255, 255, .5) 50%, #e5484d); }
.orb { width: 34px; height: 34px; }
.orb svg { width: 17px; height: 17px; }
.glass .lit::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 55%; background: radial-gradient(60% 120% at 0% 50%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 75%); }
.msg { font: 800 14px var(--display); letter-spacing: -.015em; }
.btn { padding: 9px 18px; font-size: 13.5px; }

/* ------------------------------------------------------------- 4.1 palette: deep, saturated, many hues (not pink)
   deep violet -> the accent -> electric cyan, an amber spark in the corner, a fine dot grain for detail */
:root {
  --c-cyan: oklch(from var(--accent) .74 .16 calc(h - 62));
  --c-violet: oklch(from var(--accent) .46 .24 calc(h + 28));
  --c-amber: oklch(from var(--accent) .82 .17 calc(h + 155));
  --c-pink: oklch(from var(--accent) .6 .25 calc(h + 92));
  --c-deep: oklch(from var(--accent) .34 .16 calc(h + 10));
  --grain: radial-gradient(circle, rgba(255, 255, 255, .22) 1px, transparent 1.6px) 0 0 / 13px 13px;
  --banner: var(--grain),
    radial-gradient(55% 120% at 0% 0%, rgba(255, 255, 255, .3), transparent 60%),
    radial-gradient(38% 110% at 100% 110%, color-mix(in srgb, var(--c-amber) 75%, transparent), transparent 70%),
    radial-gradient(40% 120% at 70% -20%, color-mix(in srgb, var(--c-cyan) 80%, transparent), transparent 70%),
    linear-gradient(118deg, var(--c-violet), var(--accent) 42%, var(--c-pink));
  --rim41: linear-gradient(120deg, var(--c-cyan), rgba(255, 255, 255, .85) 22%, var(--accent) 45%, var(--c-violet) 66%, var(--c-pink));
}
.dark {
  --banner: var(--grain),
    radial-gradient(55% 120% at 0% 0%, rgba(255, 255, 255, .18), transparent 60%),
    radial-gradient(38% 110% at 100% 110%, color-mix(in srgb, var(--c-amber) 60%, transparent), transparent 70%),
    radial-gradient(40% 120% at 70% -20%, color-mix(in srgb, var(--c-cyan) 70%, transparent), transparent 70%),
    linear-gradient(118deg, var(--c-deep), color-mix(in srgb, var(--accent) 85%, #000) 42%, color-mix(in srgb, var(--c-pink) 82%, #000));
}
.incognito { --banner: var(--grain), radial-gradient(55% 120% at 0% 0%, rgba(255, 220, 255, .2), transparent 60%), radial-gradient(38% 110% at 100% 110%, rgba(255, 140, 90, .55), transparent 70%), radial-gradient(40% 120% at 70% -20%, rgba(90, 200, 255, .5), transparent 70%), linear-gradient(118deg, #3a1580, #7a3cf0 50%, #c040d8); }
#t::before { background: var(--rim41); }
.orb { background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .55), transparent 55%), linear-gradient(135deg, var(--c-violet), var(--accent) 50%, var(--c-pink)); }

/* ------------------------------------------------------------- Lumen 4.5: Maison (ui/maison45.css has the whole story)
   A paper capsule with one hairline: an ink dot with the icon, the message in Geist, and the action as an ink pill that
   fills with the accent from where the pointer comes in. No blur under it, no rim, nothing to ghost. */
@font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root { --m-card: #fcfbf8; --m-fg: #15130f; --m-fg3: #8f887b; --m-line: rgba(21, 19, 15, .12); --m-solid: #15130f; --m-on-solid: #f6f3ed; --m-ease: cubic-bezier(.2, .8, .2, 1);
  --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
.dark { --m-card: #151411; --m-fg: #f2eee5; --m-fg3: #6f695e; --m-line: rgba(242, 238, 229, .14); --m-solid: #f2eee5; --m-on-solid: #0d0c0a; }
.incognito { --m-card: #1d1727; --m-fg: #f1ecf8; --m-line: rgba(241, 236, 248, .14); --m-solid: #f1ecf8; --m-on-solid: #17121f; }
#t { background: var(--m-card); color: var(--m-fg); box-shadow: inset 0 0 0 1px var(--m-line), 0 12px 30px -16px rgba(21, 19, 15, .45); padding: 6px 20px 6px 6px; min-height: 46px; }
.dark #t { box-shadow: inset 0 0 0 1px var(--m-line), 0 12px 30px -14px rgba(0, 0, 0, .8); }
#t::before, #t.bad::before, .glass .lit::after { display: none; }
#t > .glass { display: none; }
.orb, .bad .orb { width: 32px; height: 32px; background: var(--m-solid); color: var(--m-on-solid); box-shadow: none; }
.bad .orb { background: #a8323f; color: #fff; }
.orb::before, .orb::after { display: none; }
.orb svg { width: 15px; height: 15px; filter: none; }
.msg { font: 500 13.5px var(--font); letter-spacing: 0; color: var(--m-fg); }
.btn, .bad .btn { background: var(--m-solid); color: var(--m-on-solid); font: 500 12.5px var(--font); letter-spacing: .01em; box-shadow: none; filter: none; isolation: isolate;
  transition: color .42s var(--m-ease); }
.btn::after { display: none; }
.btn::before { content: ""; position: absolute; z-index: -1; left: var(--fx, 50%); top: var(--fy, 100%); width: 260%; aspect-ratio: 1; min-width: 100px; border-radius: 50%; pointer-events: none;
  background: var(--accent); transform: translate(-50%, -50%) scale(0); transition: transform .42s var(--m-ease); }
.btn:hover { filter: none; color: #fff; }
.btn:hover::before { transform: translate(-50%, -50%) scale(1); }
.time i, .bad .time i { background: var(--m-fg); box-shadow: none; opacity: .3; }
@media (prefers-reduced-motion: reduce) { .btn, .btn::before { transition: none; } }
</style>
</head>
<body>
<div id="t" role="status" aria-live="polite"><div class="glass"><div class="under"></div><div class="tint"></div><div class="lit"></div></div><span class="orb"></span><span class="msg"></span><button class="btn" hidden></button><span class="time"><i></i></span></div>
<script src="jelly.js"></script>
<script>
'use strict'
if (window.Jelly) Jelly.init({ buttons: '.btn' })
const t = document.getElementById('t')
let MOTION = 'jelly', hideT = 0, raf = 0, left = 0, ms = 2200, endAt = 0, paused = false, id = 0
// one spring, Jelly toned down (zeta ~0.64); still under Motion Off and reduced motion
const S = { v: 0, to: 0, vel: 0 }
function paint() {
  const v = S.v, y = (1 - v) * -14, s = 0.9 + 0.1 * v
  t.style.opacity = Math.max(0, Math.min(1, v * 1.4)); t.style.transform = `translateY(${y}px) scale(${s})`
}
function frame(now) {
  const k = MOTION === 'calm' ? 240 : 300, c = MOTION === 'calm' ? 25.5 : 22
  for (let i = 0; i < 4; i++) { const h = 1 / 240, a = -k * (S.v - S.to) - c * S.vel; S.vel += a * h; S.v += S.vel * h }
  paint()
  if (Math.abs(S.v - S.to) < 0.001 && Math.abs(S.vel) < 0.003) { S.v = S.to; S.vel = 0; paint(); raf = 0; if (S.to === 0) window.nova.send('toast-done', id); return }
  raf = requestAnimationFrame(frame)
}
function spring(to) {
  S.to = to
  if (MOTION === 'off') { S.v = to; S.vel = 0; paint(); if (to === 0) window.nova.send('toast-done', id); return }
  if (!raf) raf = requestAnimationFrame(frame)
}
function report() { const r = t.getBoundingClientRect(); window.nova.send('toast-size', { w: Math.ceil(t.offsetWidth), h: Math.ceil(t.offsetHeight), id }) }
function timer(rest) {
  clearTimeout(hideT); endAt = Date.now() + rest
  hideT = setTimeout(() => spring(0), rest)
  const bar = t.querySelector('.time i')
  bar.style.transition = 'none'; bar.style.transform = `scaleX(${Math.max(0, rest / ms)})`
  if (MOTION !== 'off') requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `transform ${rest}ms linear`; bar.style.transform = 'scaleX(0)' }))
}
window.nova.on('nova:toast', d => {
  id = d.id
  const th = d.theme || {}
  document.documentElement.className = (th.dark || th.incognito ? 'dark' : '') + (th.incognito ? ' incognito' : '')
  if (!th.incognito) document.documentElement.style.setProperty('--accent', th.accent || '#5b8cff')
  MOTION = th.motion === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : th.motion === 'calm' ? 'calm' : 'jelly'; if (window.Jelly) Jelly.setMode(MOTION)
  t.classList.toggle('bad', d.kind === 'bad'); t.classList.toggle('act', !!d.label)
  t.querySelector('.orb').innerHTML = d.icon || ''
  t.querySelector('.msg').textContent = d.msg || ''
  const b = t.querySelector('.btn'); b.hidden = !d.label; b.textContent = d.label || ''
  ms = d.ms || 2200
  report()
  const fresh = S.v < 0.05
  if (fresh) { S.v = 0; S.vel = 0; paint() }
  spring(1)
  if (!fresh && MOTION !== 'off') S.vel += 2.5   // a new message while one is up: a small hop
  timer(ms)
})
window.nova.on('nova:toast-close', () => { clearTimeout(hideT); spring(0) })
window.nova.on('nova:toast-backdrop', shot => {
  const u = t.querySelector('.under'); u.innerHTML = ''
  if (!shot) return
  const im = new Image(); im.src = shot.src
  im.style.cssText = `left:${shot.x + 20}px;top:${shot.y + 20}px;width:${shot.w}px;height:${shot.h}px`
  u.appendChild(im); im.decode().then(() => u.classList.add('on')).catch(() => {})
})
t.querySelector('.btn').addEventListener('click', () => { clearTimeout(hideT); window.nova.send('toast-act', id); spring(0) })
// hovering holds the toast; it runs out once the pointer leaves
t.addEventListener('mouseenter', () => { if (S.to !== 1) return; paused = true; left = Math.max(900, endAt - Date.now()); clearTimeout(hideT); const bar = t.querySelector('.time i'); bar.style.transition = 'none'; bar.style.transform = `scaleX(${Math.max(0, left / ms)})` })
t.addEventListener('mouseleave', () => { if (!paused) return; paused = false; timer(left) })
// 4.5: the flow fill on the action grows from where the pointer came in
for (const ev of ['pointerover', 'pointerout']) t.querySelector('.btn').addEventListener(ev, e => { const b = e.currentTarget; if (e.relatedTarget && b.contains(e.relatedTarget)) return; const r = b.getBoundingClientRect(); b.style.setProperty('--fx', Math.round(e.clientX - r.left) + 'px'); b.style.setProperty('--fy', Math.round(e.clientY - r.top) + 'px') }, { passive: true })
</script>
</body>
</html>
