<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lumen menu</title>
<!-- Lumen's own right-click menus (docs/NOVA.md): liquid glass, Jelly springs, keycaps, submenus. No emoji. -->
<style>
:root {
  --accent: #5b8cff;
  --accent2: oklch(from var(--accent) calc(l - .02) c calc(h + 40));
  --accent3: oklch(from var(--accent) calc(l + .04) c calc(h + 95));
  --nova: linear-gradient(135deg, var(--accent), var(--accent2) 55%, var(--accent3));
  --fg: #141722; --fg2: rgba(20, 23, 34, .62); --fg3: rgba(20, 23, 34, .40);
  --tint: rgba(250, 251, 255, .55); --tint-solid: rgba(250, 251, 255, .955);
  --line: rgba(20, 24, 48, .09);
  --spec: inset 0 1px 0 rgba(255, 255, 255, .75);
  --hi: color-mix(in srgb, var(--accent) 15%, rgba(255, 255, 255, .5));
  --edge: linear-gradient(135deg, color-mix(in srgb, var(--accent) 70%, transparent), rgba(255, 255, 255, .55) 38%, rgba(255, 255, 255, .15) 62%, color-mix(in srgb, var(--accent3) 60%, transparent));
  --shadow: 0 1px 2px rgba(14, 18, 40, .08), 0 10px 28px color-mix(in srgb, var(--accent) 24%, rgba(14, 18, 40, .12)), 0 30px 70px color-mix(in srgb, var(--accent) 22%, rgba(14, 18, 40, .12)), 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent), 0 0 46px color-mix(in srgb, var(--accent) 14%, transparent);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, var(--font);
  color-scheme: light;
}
.dark {
  --fg: #eef0fa; --fg2: rgba(238, 240, 250, .64); --fg3: rgba(238, 240, 250, .38);
  --tint: color-mix(in srgb, var(--accent) 7%, rgba(16, 19, 31, .58)); --tint-solid: color-mix(in srgb, var(--accent) 5%, rgba(16, 19, 31, .955));
  --line: rgba(255, 255, 255, .09);
  --spec: inset 0 1px 0 rgba(255, 255, 255, .16);
  --hi: color-mix(in srgb, var(--accent) 26%, rgba(255, 255, 255, .06));
  --edge: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, transparent), rgba(255, 255, 255, .16) 38%, rgba(255, 255, 255, .05) 62%, color-mix(in srgb, var(--accent3) 75%, transparent));
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px color-mix(in srgb, var(--accent) 26%, rgba(0, 0, 0, .4)), 0 32px 80px color-mix(in srgb, var(--accent) 22%, rgba(0, 0, 0, .38)), 0 0 54px color-mix(in srgb, var(--accent) 20%, transparent);
  color-scheme: dark;
}
.incognito { --accent: #a77dff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px/1.3 var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; user-select: none; cursor: default; -webkit-app-region: no-drag; }

/* ------------------------------------------------------------- the glass panel */
.panel {
  position: fixed; min-width: 236px; max-width: 380px; padding: 6px; border-radius: 16px; isolation: isolate;
  box-shadow: var(--spec), var(--shadow); transform-origin: var(--ox, 0) var(--oy, 0); will-change: transform, opacity;
  --gx: 50%; --gy: 0%;
}
.panel > .glass { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: -1; pointer-events: none; }
/* refraction: the real window underneath, bent at the rim by the lens map, blurred and saturated */
.glass .refract { position: absolute; inset: -24px; filter: blur(8px) saturate(2) brightness(1.05); opacity: 0; transition: opacity .22s ease-out; }
.lens .glass .refract { filter: blur(6px) saturate(2) brightness(1.05) var(--lensf, none); }
.glass .refract.on { opacity: 1; }
.glass .refract img { position: absolute; display: block; }
/* before the picture arrives, a soft accent nebula stands in for it */
.glass .nebula { position: absolute; inset: -20%; background:
  radial-gradient(42% 38% at 18% 12%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%),
  radial-gradient(40% 40% at 88% 92%, color-mix(in srgb, var(--accent3) 26%, transparent), transparent 70%),
  radial-gradient(30% 30% at 80% 20%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 70%); }
.glass .tint { position: absolute; inset: 0; background: var(--tint-solid); transition: background .25s; }
.panel.seen .glass .tint { background: var(--tint); }
/* caustic: light gathering inside the glass, drifting slowly */
.glass .caustic { position: absolute; inset: -30%; mix-blend-mode: plus-lighter; opacity: .55; background:
  radial-gradient(26% 20% at 22% 8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
  radial-gradient(30% 24% at 78% 100%, color-mix(in srgb, var(--accent3) 24%, transparent), transparent 72%);
  animation: drift 9s ease-in-out infinite alternate; }
.dark .glass .caustic { opacity: .8; }
@keyframes drift { from { transform: translate(-3%, -2%) rotate(-2deg); } to { transform: translate(3%, 2%) rotate(2deg); } }
/* drifting saturated colour inside the glass, like the Settings heroes */
.glass .orb { position: absolute; border-radius: 50%; filter: blur(26px); mix-blend-mode: normal; }
.glass .orb.a { width: 180px; height: 180px; left: -70px; top: -80px; background: color-mix(in srgb, var(--accent) 34%, transparent); animation: orba 13s ease-in-out infinite alternate; }
.glass .orb.b { width: 200px; height: 170px; right: -80px; bottom: -90px; background: color-mix(in srgb, var(--accent3) 30%, transparent); animation: orbb 16s ease-in-out infinite alternate; }
.dark .glass .orb.a { background: color-mix(in srgb, var(--accent) 42%, transparent); }
@keyframes orba { to { transform: translate(60px, 50px) scale(1.15); } }
@keyframes orbb { to { transform: translate(-50px, -40px) scale(1.1); } }
.glass .sweep { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .34) 50%, transparent 65%); transform: translateX(-110%); animation: sweepin 1.1s .12s ease-out both; }
.dark .glass .sweep { background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .10) 50%, transparent 65%); }
@keyframes sweepin { to { transform: translateX(110%); } }
.off .glass .orb, .off .glass .caustic, .off .glass .sweep { animation: none; }
.off .glass .sweep { display: none; }
/* specular glint that follows the pointer */
.glass .glint { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; mix-blend-mode: soft-light;
  background: radial-gradient(180px circle at var(--gx) var(--gy), rgba(255, 255, 255, .9), transparent 62%); }
.panel:hover .glass .glint { opacity: 1; }
.dark .glass .glint { mix-blend-mode: plus-lighter; background: radial-gradient(160px circle at var(--gx) var(--gy), rgba(255, 255, 255, .10), transparent 62%); }
/* top sheen and inner glow */
.glass .sheen { position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 38%);
  box-shadow: inset 0 0 22px color-mix(in srgb, var(--accent) 12%, transparent), inset 0 -10px 24px color-mix(in srgb, var(--accent3) 8%, transparent); }
.dark .glass .sheen { background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 34%); }
/* the rim: a refractive 1px edge, brighter where the light is, with a chromatic fringe */
.panel::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 3;
  background: radial-gradient(140px circle at var(--gx) var(--gy), rgba(255, 255, 255, .95), transparent 70%), var(--edge);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.panel::after { content: ''; position: absolute; inset: 1px; border-radius: 15px; pointer-events: none; z-index: 3;
  box-shadow: inset 1.5px 0 0 rgba(255, 60, 120, .10), inset -1.5px 0 0 rgba(40, 170, 255, .12), inset 0 -1.5px 0 rgba(120, 255, 210, .06); }
.dark .panel::after { box-shadow: inset 1.5px 0 0 rgba(255, 80, 140, .14), inset -1.5px 0 0 rgba(60, 180, 255, .16), inset 0 -1.5px 0 rgba(120, 255, 210, .08); }

.scroll { position: relative; overflow-y: auto; overflow-x: hidden; max-height: var(--maxh, none); scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ------------------------------------------------------------- rows */
.hl { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-radius: 10px; pointer-events: none; opacity: 0; z-index: 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent3) 14%, transparent));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent), 0 4px 16px color-mix(in srgb, var(--accent) 22%, transparent), inset 0 1px 0 rgba(255, 255, 255, .35); }
.dark .hl { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 38%, transparent), color-mix(in srgb, var(--accent3) 22%, transparent)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), 0 4px 18px color-mix(in srgb, var(--accent) 30%, transparent), inset 0 1px 0 rgba(255, 255, 255, .12); }
.row { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px 0 8px; border-radius: 10px; white-space: nowrap; }
.row .ic { width: 18px; height: 18px; flex: none; display: grid; place-items: center; color: var(--fg2); transition: color .14s, transform .3s cubic-bezier(.3, 1.5, .5, 1); }
.row .ic svg { width: 16px; height: 16px; }
.row .ic img { width: 16px; height: 16px; border-radius: 4px; }
.row .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500; letter-spacing: -.005em; }
.row .kc { display: flex; gap: 3px; margin-left: 14px; }
.row kbd { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 6px; font: 650 10.5px var(--font); color: var(--fg2);
  background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .35)); box-shadow: inset 0 -1px 0 var(--line), inset 0 0 0 1px var(--line), 0 1px 2px rgba(14, 18, 40, .06); }
.dark .row kbd { background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .04)); }
.row .chev { margin-left: 12px; color: var(--fg3); display: grid; transition: transform .3s cubic-bezier(.3, 1.5, .5, 1), color .14s; }
.row.on { color: var(--fg); }
.row.on .ic { color: var(--accent); transform: scale(1.08); }
.dark .row.on .ic { color: color-mix(in srgb, var(--accent) 50%, #fff); }
.row.on .chev { color: var(--accent); transform: translateX(2px); }
.row.on kbd { color: var(--fg); }
.row.open .chev { color: var(--accent); }
.row.off { color: var(--fg3); }
.row.off .ic { color: var(--fg3); opacity: .7; }
.row.press { transform: scale(.97); transition: transform .08s; }
.row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--nova); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 10px var(--accent); }
.row .sw { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), 0 0 0 2.5px transparent; }
.row .sw.cur { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), 0 0 0 2px var(--tint-solid), 0 0 0 3.5px var(--accent); }
.sep { height: 1px; margin: 5px 10px; background: linear-gradient(90deg, transparent, var(--line) 14%, color-mix(in srgb, var(--accent) 20%, var(--line)) 50%, var(--line) 86%, transparent); }
.row .lb b { font-weight: 700; color: var(--accent); }

/* ------------------------------------------------------------- Lumen 4.0 */
/* dark and private glass reads as deep ink, never grey, even over a bright page */
.dark { --tint: color-mix(in srgb, var(--accent) 11%, rgba(11, 13, 26, .8)); --tint-solid: color-mix(in srgb, var(--accent) 8%, rgba(11, 13, 26, .97)); }
.incognito { --tint: rgba(30, 14, 58, .84); --tint-solid: rgba(26, 12, 50, .97); --hi: rgba(162, 89, 255, .3); --line: rgba(220, 180, 255, .12); }
.panel { border-radius: 18px; padding: 7px; }
.panel::after { border-radius: 17px; }
/* a lit band along the top of the glass */
.glass .sheen { background: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 30%), radial-gradient(80% 40% at 0% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
.dark .glass .sheen { background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0) 30%), radial-gradient(80% 40% at 0% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); }
.row { height: 32px; border-radius: 11px; gap: 11px; }
.hl { height: 32px; border-radius: 11px; }
/* the icon sits in a small glass tile that lights up with the row */
.row .ic { width: 22px; height: 22px; border-radius: 7px; transition: color .14s, background .18s, box-shadow .2s, transform .3s cubic-bezier(.3, 1.5, .5, 1); }
.row .ic svg { width: 15px; height: 15px; }
.row.on .ic { color: #fff; background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .5), transparent 55%), var(--nova); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 3px 10px -2px color-mix(in srgb, var(--accent) 60%, transparent); }
.dark .row.on .ic { color: #fff; }
/* each row's tile takes the next colour on the accent wheel */
.row:nth-of-type(3n+1).on .ic { background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .5), transparent 55%), linear-gradient(140deg, var(--accent2), var(--accent3)); }
.row:nth-of-type(3n+2).on .ic { background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .5), transparent 55%), linear-gradient(140deg, var(--accent3), var(--accent)); }
.row.on kbd { color: var(--accent); }
.dark .row.on kbd { color: #fff; }
/* the glass holds still while the menu is open: the colour settles once and stays */
.glass .caustic { animation-iteration-count: 1; }
.glass .orb.a, .glass .orb.b { animation-iteration-count: 2; }

/* ------------------------------------------------------------- Lumen 4.1: recomposed
   Each group between separators sits in its own recessed glass card; every row carries a coloured gem tile at rest
   (its own stop on the accent wheel); the row under the pointer turns into a solid banner of colour with white type. */
.panel { border-radius: 24px; padding: 8px; min-width: 268px; }
.panel::after { border-radius: 23px; }
.panel::before { padding: 1.5px; background: radial-gradient(160px circle at var(--gx) var(--gy), rgba(255, 255, 255, .95), transparent 70%), linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent2) 70%, #fff) 40%, rgba(255, 255, 255, .45) 55%, var(--accent3)); }
:root { --shadow: 0 1px 2px rgba(14, 18, 40, .08), 0 0 0 6px color-mix(in srgb, var(--accent) 9%, transparent), 0 14px 34px color-mix(in srgb, var(--accent) 30%, rgba(14, 18, 40, .14)), 0 40px 90px color-mix(in srgb, var(--accent) 30%, rgba(14, 18, 40, .14)); }
.dark { --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 6px color-mix(in srgb, var(--accent) 14%, transparent), 0 14px 34px color-mix(in srgb, var(--accent) 34%, rgba(0, 0, 0, .4)), 0 40px 96px color-mix(in srgb, var(--accent) 30%, rgba(0, 0, 0, .4)); }
:root { --banner: radial-gradient(60% 140% at 0% 0%, rgba(255, 255, 255, .32), transparent 60%), linear-gradient(120deg, var(--accent), var(--accent2) 55%, var(--accent3));
  --well: color-mix(in srgb, var(--accent) 6%, rgba(14, 18, 40, .045)); }
.dark { --banner: radial-gradient(60% 140% at 0% 0%, rgba(255, 255, 255, .2), transparent 60%), linear-gradient(120deg, color-mix(in srgb, var(--accent) 88%, #000), color-mix(in srgb, var(--accent2) 85%, #000) 55%, color-mix(in srgb, var(--accent3) 85%, #000));
  --well: rgba(0, 0, 0, .22); }
.incognito { --banner: radial-gradient(60% 140% at 0% 0%, rgba(255, 220, 255, .22), transparent 60%), linear-gradient(120deg, #6d3bd8, #a24bff 55%, #e0479f); --well: rgba(0, 0, 0, .26); }
.grp { margin: 0 0 6px; padding: 3px; border-radius: 17px; background: var(--well); box-shadow: inset 0 1px 2px rgba(14, 18, 40, .06), 0 1px 0 rgba(255, 255, 255, .6); }
.dark .grp { box-shadow: inset 0 1px 2px rgba(0, 0, 0, .3), 0 1px 0 rgba(255, 255, 255, .04); }
.grp:last-child { margin-bottom: 0; }
.sep { display: none; }
.hl { left: 3px; right: 3px; height: 36px; border-radius: 14px; z-index: 2; background: var(--banner);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent), 0 10px 24px -8px color-mix(in srgb, var(--accent) 90%, transparent); }
.dark .hl { background: var(--banner); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26), 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), 0 10px 24px -8px color-mix(in srgb, var(--accent) 95%, transparent); }
.row { z-index: 3; height: 36px; border-radius: 14px; gap: 12px; padding: 0 12px 0 6px; font-size: 13.5px; transition: color .12s; }
.row .ic { transition: color .14s, transform .3s cubic-bezier(.3, 1.5, .5, 1); }
.row .lb { font-weight: 600; }
.row .ic { --tc: oklch(from var(--accent) calc(l + .02) c calc(h + var(--hs, 0))); width: 26px; height: 26px; border-radius: 9px; color: var(--tc);
  background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .7), transparent 60%), color-mix(in srgb, var(--tc) 16%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 22%, transparent); }
.dark .row .ic { color: oklch(from var(--tc) calc(l + .14) c h); background: radial-gradient(120% 100% at 30% 0%, rgba(255, 255, 255, .14), transparent 60%), color-mix(in srgb, var(--tc) 22%, transparent); }
.row .ic:empty { background: none; box-shadow: none; }
.row .ic svg { width: 15px; height: 15px; }
.row.on, .dark .row.on { color: #fff; }
.row.on .ic, .row:nth-of-type(3n+1).on .ic, .row:nth-of-type(3n+2).on .ic, .dark .row.on .ic { color: #fff; background: rgba(255, 255, 255, .24); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), inset 0 0 0 1px rgba(255, 255, 255, .3), 0 4px 10px -3px rgba(0, 0, 0, .3); transform: scale(1.1) rotate(-5deg); }
.row.on kbd, .dark .row.on kbd { color: #fff; background: rgba(255, 255, 255, .22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 0 0 1px rgba(255, 255, 255, .28); }
.row.on .chev, .row.open .chev { color: #fff; }
.row.off .ic { background: none; box-shadow: none; }
.row .lb b { color: inherit; }
.row.on .lb b { color: #fff; }
.row .sw { width: 15px; height: 15px; }
.row .dot { width: 8px; height: 8px; }
.row.on .dot { background: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .3); }
.glass .sweep { background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .5) 50%, transparent 65%); }

/* ultra liquid glass, cheaply: a bright top-left specular edge, inner glow, a fake-refraction sheen, chromatic edge tint */
:root { --spec: inset 1.5px 1.5px 0 rgba(255, 255, 255, .95), inset -1px -1px 0 rgba(255, 255, 255, .3), inset 0 0 22px color-mix(in srgb, var(--accent) 16%, transparent), inset 3px 0 0 -1px rgba(255, 60, 140, .16), inset -3px 0 0 -1px rgba(50, 180, 255, .2); }
.dark { --spec: inset 1.5px 1.5px 0 rgba(255, 255, 255, .3), inset -1px -1px 0 rgba(255, 255, 255, .06), inset 0 0 24px color-mix(in srgb, var(--accent) 24%, transparent), inset 3px 0 0 -1px rgba(255, 80, 150, .24), inset -3px 0 0 -1px rgba(60, 190, 255, .26); }
.glass .sheen { background: linear-gradient(135deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, .1) 30%, transparent 44%, transparent 72%, rgba(255, 255, 255, .2) 94%), radial-gradient(80% 40% at 0% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%); }
.dark .glass .sheen { background: linear-gradient(135deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .03) 30%, transparent 44%, transparent 72%, rgba(255, 255, 255, .06) 94%), radial-gradient(80% 40% at 0% 0%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%); }
.panel::before { padding: 2px; }

/* ------------------------------------------------------------- 4.1 palette: deep, saturated, many hues (not pink)
   deep violet -> the accent -> electric cyan, an amber spark in the corner, a fine dot grain for detail */
:root {
  --c-cyan: oklch(from var(--accent) .74 .16 calc(h - 62));
  --c-violet: oklch(from var(--accent) .46 .24 calc(h + 28));
  --c-amber: oklch(from var(--accent) .82 .17 calc(h + 155));
  --c-pink: oklch(from var(--accent) .6 .25 calc(h + 92));
  --c-deep: oklch(from var(--accent) .34 .16 calc(h + 10));
  --grain: radial-gradient(circle, rgba(255, 255, 255, .22) 1px, transparent 1.6px) 0 0 / 13px 13px;
  --banner: var(--grain),
    radial-gradient(55% 120% at 0% 0%, rgba(255, 255, 255, .3), transparent 60%),
    radial-gradient(38% 110% at 100% 110%, color-mix(in srgb, var(--c-amber) 75%, transparent), transparent 70%),
    radial-gradient(40% 120% at 70% -20%, color-mix(in srgb, var(--c-cyan) 80%, transparent), transparent 70%),
    linear-gradient(118deg, var(--c-violet), var(--accent) 42%, var(--c-pink));
  --rim41: linear-gradient(120deg, var(--c-cyan), rgba(255, 255, 255, .85) 22%, var(--accent) 45%, var(--c-violet) 66%, var(--c-pink));
}
.dark {
  --banner: var(--grain),
    radial-gradient(55% 120% at 0% 0%, rgba(255, 255, 255, .18), transparent 60%),
    radial-gradient(38% 110% at 100% 110%, color-mix(in srgb, var(--c-amber) 60%, transparent), transparent 70%),
    radial-gradient(40% 120% at 70% -20%, color-mix(in srgb, var(--c-cyan) 70%, transparent), transparent 70%),
    linear-gradient(118deg, var(--c-deep), color-mix(in srgb, var(--accent) 85%, #000) 42%, color-mix(in srgb, var(--c-pink) 82%, #000));
}

const PRE = { jelly: { k: 300, c: 22 }, calm: { k: 240, c: 25.5 }, snappy: { k: 520, c: 38 } }

class Spring {
  constructor(v, cb, kind = 'jelly') { this.v = v; this.t = v; this.vel = 0; this.cb = cb; this.kind = kind }

  step(dt) {
    const c = MOTION === 'calm' && this.kind === 'jelly' ? PRE.calm : PRE[this.kind]

    this.cb(this.v)
  }
}

// ---------------------------------------------------------------- the lens map: displacement strongest at the rim
function lensMap(w, h, r, rim, pad) {
  const S = 0.5, W = Math.max(2, Math.round(w * S)), H = Math.max(2, Math.round(h * S))

  const iw = (w - 2 * pad) / 2, ih = (h - 2 * pad) / 2
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const px = x / S - w / 2, py = y / S - h / 2
    const qx = Math.abs(px) - (iw - r), qy = Math.abs(py) - (ih - r)
    const ox = Math.max(qx, 0), oy = Math.max(qy, 0)
    const dist = Math.hypot(ox, oy) + Math.min(Math.max(qx, qy), 0) - r   // < 0 inside the shape

function buildPanel(items, parentItem, level) {
  const p = document.createElement('div'); p.className = 'panel'; p.dataset.level = level

  const sc = p.querySelector('.scroll')
  // each run of rows between separators becomes its own glass card
  let grp = null, n = 0
  const newGrp = () => { grp = document.createElement('div'); grp.className = 'grp'; sc.appendChild(grp) }
  for (const it of items) {
    if (it.type === 'separator') { if (grp && grp.children.length) grp = null; continue }
    if (!grp) newGrp()
    const r = document.createElement('div'); r.className = 'row' + (it.enabled ? '' : ' off'); r.dataset.id = it.id; r.setAttribute('role', 'menuitem')
    r.innerHTML = `<span class="ic">${iconFor(it, parentItem)}</span><span class="lb"></span>` +

    r.querySelector('.lb').textContent = it.label
    r._it = it
    r.querySelector('.ic').style.setProperty('--hs', String((n++ * 38) % 300))
    grp.appendChild(r)
  }
  p._items = items; p._level = level; p._cur = null
  const hl = p.querySelector('.hl')
  p._hy = new Spring(0, v => { hl.style.transform = `translateY(${v}px)` })
  p._hs = new Spring(0, v => { hl.style.opacity = Math.max(0, Math.min(1, v)); hl.style.scale = `${0.94 + 0.06 * Math.min(1, v)} 1` }, 'snappy')
  p.addEventListener('mousemove', e => { const b = p.getBoundingClientRect(); p.style.setProperty('--gx', (e.clientX - b.left) + 'px'); p.style.setProperty('--gy', (e.clientY - b.top) + 'px') })

}

function setCur(p, r, { kb = false } = {}) {

  r.classList.add('on')

  if (kb) r.scrollIntoView({ block: 'nearest' })
}
function place(p, x, y, { sub = false, from = null } = {}) {
  const pad = 8
  p.style.left = '0px'; p.style.top = '0px'
  const sc = p.querySelector('.scroll'); sc.style.removeProperty('--maxh')
  let w = p.offsetWidth, h = p.offsetHeight
  if (h > vh() - pad * 2) { sc.style.setProperty('--maxh', (vh() - pad * 2 - 12) + 'px'); h = p.offsetHeight }
  let left = x, top = y, ox = 'left', oy = 'top'
  if (sub && from) {
    const b = from.getBoundingClientRect()
    left = b.right - 2; top = b.top - 7
    if (left + w > vw() - pad) { left = b.left - w + 2; ox = 'right' }
  } else if (left + w > vw() - pad) { left = left - w >= pad ? left - w : vw() - w - pad; ox = 'right' }
  if (top + h > vh() - pad) { if (!sub && top - h >= pad) { top = top - h; oy = 'bottom' } else top = vh() - h - pad }
  left = Math.max(pad, left); top = Math.max(pad, top)
  p.style.left = left + 'px'; p.style.top = top + 'px'
  p.style.setProperty('--ox', ox); p.style.setProperty('--oy', oy)
  paintBackdrop(p)
  applyLens(p.querySelector('.refract'), w + 48, h + 48)
}
function paintBackdrop(p) {
  if (!shots.length) return
  const rf = p.querySelector('.refract'), b = p.getBoundingClientRect()
  rf.innerHTML = ''
  for (const s of shots) {
    const im = new Image(); im.src = s.src
    im.style.cssText = `left:${s.x - b.left + 24}px;top:${s.y - b.top + 24}px;width:${s.w}px;height:${s.h}px`
    rf.appendChild(im)
  }
  requestAnimationFrame(() => { rf.classList.add('on'); p.classList.add('seen') })
}
function enter(p, { sub = false } = {}) {
  const sc = p.querySelector('.scroll'), list = [...sc.querySelectorAll('.grp, .row')]
  if (MOTION === 'off') return
  const s = new Spring(0, v => {
    const k = Math.min(1.2, v)
    p.style.opacity = Math.min(1, v * 1.6)
    p.style.transform = `scale(${(sub ? 0.92 : 0.84) + (sub ? 0.08 : 0.16) * k}, ${(sub ? 0.9 : 0.78) + (sub ? 0.1 : 0.22) * k})`
  })
  s.to(1)
  // rows arrive 12ms apart: quick enough for a menu, still alive
  // if frames were held back, land on the final state anyway
  setTimeout(() => { if (!p.isConnected || p._closing) return; s.set(1); list.forEach(n => { n.style.opacity = '1'; n.style.transform = 'none' }) }, 700)
  list.slice(0, 24).forEach((n, i) => {
    n.style.opacity = '0'
    const isRow = n.classList.contains('row')
    const r = new Spring(0, v => { n.style.opacity = Math.min(1, v * 1.4); if (isRow) n.style.transform = `translateX(${(1 - v) * -10}px)` })
    setTimeout(() => r.to(1), 16 + i * 11)
  })
}
function openSub(p, r) {
  closeFrom(p._level + 1)
  if (!r || !r._it.submenu || !r._it.enabled) return null
  r.classList.add('open')
  const sp = buildPanel(r._it.submenu, r._it, p._level + 1)
  sp._from = r
  place(sp, 0, 0, { sub: true, from: r })
  panels.push(sp)
  enter(sp, { sub: true })
  return sp
}
function closeFrom(level) {
  while (panels.length > level) { const p = panels.pop(); if (p._from) p._from.classList.remove('open'); const rf = p.querySelector('.refract'); if (rf && rf._lens) rf._lens.remove(); p.remove() }
}
function activate(r) {
  if (!r || r.classList.contains('off')) return
  if (r._it.type === 'submenu') { const p = r.closest('.panel'); const sp = openSub(p, r); if (sp) setCur(sp, rows(sp).find(x => !x.classList.contains('off')), { kb: true }); return }
  r.classList.add('press')
  window.nova.send('pick', r._it.id)
}
function close(why) { window.nova.send('close', why) }

function open(d) {
  clearTimeout(exitT)
  closeFrom(0); shots = []
  document.documentElement.className = (d.theme.dark || d.theme.incognito ? 'dark' : '') + (d.theme.incognito ? ' incognito' : '') + (d.theme.motion === 'off' ? ' off' : '')
  document.documentElement.style.setProperty('--accent', d.theme.incognito ? '#a77dff' : d.theme.accent)
  MOTION = d.theme.motion === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : d.theme.motion === 'calm' ? 'calm' : 'jelly'
  document.body.style.opacity = '1'
  root = buildPanel(d.items, null, 0)
  panels = [root]
  place(root, d.x + 2, d.y + 2)
  enter(root)
  openedAt = performance.now(); moved = false
}
let exitT = 0
function exit() {
  const ps = panels.slice(); panels = []; root = null
  ps.forEach(p => { p._closing = true })
  if (MOTION === 'off' || !ps.length) { ps.forEach(p => { const rf = p.querySelector('.refract'); if (rf && rf._lens) rf._lens.remove(); p.remove() }); return }
  // the close is a spring too, run on the compositor (a stiff one, so it is gone inside the 110ms the view stays up)
  const ease = window.Jelly ? Jelly.easing('glide') : { easing: 'ease-in', duration: 100 }
  ps.forEach(p => {
    const from = getComputedStyle(p).transform
    p.style.opacity = '0'; p.style.transform = 'scale(.9, .86)'
    p.animate([{ opacity: 1, transform: from === 'none' ? 'none' : from }, { opacity: 0, transform: 'scale(.9, .86)' }], { duration: Math.min(110, ease.duration), easing: ease.easing })
  })
  exitT = setTimeout(() => ps.forEach(p => { const rf = p.querySelector('.refract'); if (rf && rf._lens) rf._lens.remove(); p.remove() }), 120)
}

// ---------------------------------------------------------------- pointer
let hoverT = 0
document.addEventListener('mousemove', e => {
  moved = true
  const r = e.target.closest && e.target.closest('.row'); const p = e.target.closest && e.target.closest('.panel')
  if (!p) return
  if (r && !r.classList.contains('off')) setCur(p, r); else if (!r) setCur(p, null)
  // the parent row of an open submenu stays lit
  for (let l = 0; l < p._level; l++) { const child = panels[l + 1]; if (child && child._from && panels[l]._cur !== child._from) setCur(panels[l], child._from) }
  clearTimeout(hoverT)
  if (r && r._it.type === 'submenu') { if (!r.classList.contains('open')) hoverT = setTimeout(() => openSub(p, r), 110) }
  else if (r) hoverT = setTimeout(() => closeFrom(p._level + 1), 220)
})
document.addEventListener('mousedown', e => {
  const p = e.target.closest && e.target.closest('.panel')
  if (!p) { close('outside'); return }
  const r = e.target.closest('.row'); if (r && !r.classList.contains('off')) r.classList.add('press')
})
document.addEventListener('mouseup', e => {
  document.querySelectorAll('.row.press').forEach(r => r.classList.remove('press'))
  const r = e.target.closest && e.target.closest('.row')
  // the release of the right-click that opened the menu must not pick anything
  if (!r || (!moved && performance.now() - openedAt < 300)) return
  if (r._it.type === 'submenu') { const p = r.closest('.panel'); clearTimeout(hoverT); if (!r.classList.contains('open')) openSub(p, r); return }
  activate(r)
})
document.addEventListener('contextmenu', e => { e.preventDefault(); if (!(e.target.closest && e.target.closest('.panel'))) close('outside') })
document.addEventListener('wheel', e => { if (!(e.target.closest && e.target.closest('.panel'))) close('outside') }, { passive: true })
addEventListener('blur', () => {})

// ---------------------------------------------------------------- keyboard (arrows, Enter, Esc, type to select)
function key(k, shift) {
  if (!panels.length) return
  const p = panels[panels.length - 1]
  const list = rows(p).filter(r => !r.classList.contains('off'))
  const i = list.indexOf(p._cur)
  if (k === 'Escape') { if (panels.length > 1) { const from = p._from; closeFrom(panels.length - 1); setCur(panels[panels.length - 1], from, { kb: true }) } else close('escape'); return }
  if (k === 'ArrowDown' || (k === 'Tab' && !shift)) return setCur(p, list[(i + 1) % list.length], { kb: true })
  if (k === 'ArrowUp' || (k === 'Tab' && shift)) return setCur(p, list[(i - 1 + list.length) % list.length] || list[list.length - 1], { kb: true })
  if (k === 'Home') return setCur(p, list[0], { kb: true })
  if (k === 'End') return setCur(p, list[list.length - 1], { kb: true })
  if (k === 'ArrowRight') { if (p._cur && p._cur._it.type === 'submenu') activate(p._cur); return }
  if (k === 'ArrowLeft') { if (panels.length > 1) { const from = p._from; closeFrom(panels.length - 1); setCur(panels[panels.length - 1], from, { kb: true }) } return }
  if (k === 'Enter' || k === ' ') { if (p._cur) activate(p._cur); else if (k === 'Enter') close('enter'); return }
  if (k.length === 1 && /\S/.test(k)) {
    const now = performance.now(); typed = now - typedT > 700 ? k.toLowerCase() : typed + k.toLowerCase(); typedT = now
    const start = typed.length === 1 ? i + 1 : Math.max(0, i)
    const order = [...list.slice(start), ...list.slice(0, start)]
    const hit = order.find(r => r._it.label.toLowerCase().startsWith(typed))
    if (hit) setCur(p, hit, { kb: true })
  }
}
document.addEventListener('keydown', e => { e.preventDefault(); key(e.key, e.shiftKey) })

window.nova.on('nova:menu-open', open)
window.nova.on('nova:menu-close', exit)
window.nova.on('nova:menu-key', d => key(d.key, d.shift))
window.nova.on('nova:menu-backdrop', s => { shots = s || []; panels.forEach(paintBackdrop) })
// for tests: find a row by label and pick it the way a click does
window.__novaPick = label => { const r = [...document.querySelectorAll('.row')].find(x => x._it.label === label); if (!r) return false; activate(r); return true }
window.__novaRows = () => [...document.querySelectorAll('.panel')].map(p => rows(p).map(r => ({ label: r._it.label, on: r.classList.contains('on'), off: r.classList.contains('off') })))
</script>
</body>
</html>
